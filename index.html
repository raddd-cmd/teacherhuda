      "في النفي والسؤال مع الجمع نستخدم <span class='hl'>any</span> غالبًا."],
 form:{head:["الحالة","الصيغة","مثال"],rows:[["مفرد","There is (There's)","There is a mosque near my house."],["جمع","There are","There are thirty students in my class."],["سؤال","Is / Are there…?","Are there any windows?"]]},
 ex:[["There is a big garden behind the school.","يوجد حديقة كبيرة خلف المدرسة."],["There are two computers in the lab.","يوجد جهازا حاسب في المعمل."],["There isn't any water in the bottle.","لا يوجد ماء في القارورة."],["Are there any questions?","هل يوجد أي أسئلة؟"]],
 mis:[["There is many books here.","There are many books here.","many books جمع ← There are."],["It is a park near my house.","There is a park near my house.","للتعبير عن الوجود نستخدم There is لا It is."]],
 q:[
  {t:"mcq",q:"___ a new student in our class.",o:["There is","There are","It is","They are"],a:0,e:"a new student مفرد ← There is."},
  {t:"mcq",q:"___ any shops near the school?",o:["Is there","Are there","There are","Have there"],a:1,e:"shops جمع وسؤال ← Are there."},
  {t:"mcq",q:"There ___ four seasons in the year.",o:["is","are","was","be"],a:1,e:"four seasons جمع ← are."},
  {t:"gap",q:"There ___ a clock on the wall.",a:["is","'s"],e:"a clock مفرد ← is."},
  {t:"gap",q:"There ___ not any milk in the fridge.",a:["is"],e:"milk غير معدود ← is not."},
  {t:"gap",q:"___ there many people in the market?",a:["Are","are"],e:"people تُعامل جمعًا ← Are there."},
  {t:"ord",w:["are","There","some","the","on","apples","table"],a:"There are some apples on the table",e:"There are + اسم جمع + شبه جملة المكان."},
  {t:"ord",w:["Is","a","there","library","school","in","your","?"],a:"Is there a library in your school ?",e:"السؤال يبدأ بـ Is there."}
 ]},

{id:"L4",lvl:"A1",t:"Articles: a / an / the",ta:"أدوات النكرة والتعريف",
 intro:"الأدوات كلمات صغيرة قبل الأسماء، لكن الخطأ فيها واضح جدًا. القاعدة بسيطة إذا فهمت الفرق بين الجديد والمعروف.",
 pts:["<span class='hl'>a</span> قبل الكلمة التي تبدأ بصوت ساكن، و<span class='hl'>an</span> قبل صوت متحرك: <span class='en'>a book · an apple · an hour</span>.",
      "نستخدم a / an عند ذكر الشيء <span class='hl'>لأول مرة</span>، ثم the عند إعادة ذكره.",
      "نستخدم the للشيء المعروف أو الوحيد: <span class='en'>the sun, the teacher, the first</span>.",
      "لا نستخدم a / an مع الجمع أو غير المعدود: <span class='en'>I like rice.</span> لا <span class='en'>a rice</span>."],
 form:{head:["الأداة","متى؟","مثال"],rows:[["a","نكرة تبدأ بصوت ساكن","a student, a university"],["an","نكرة تبدأ بصوت متحرك","an egg, an hour"],["the","معرفة أو وحيدة","the moon, the answer"]]},
 ex:[["I have a bike. The bike is red.","عندي دراجة. الدراجة حمراء."],["She eats an orange every morning.","تأكل برتقالة كل صباح."],["The sun rises in the east.","تشرق الشمس من الشرق."],["My uncle is an engineer.","عمي مهندس."]],
 mis:[["I saw a elephant.","I saw an elephant.","elephant تبدأ بصوت متحرك ← an."],["The water is important for the life.","Water is important for life.","الأسماء العامة غير المعدودة لا تحتاج the."]],
 q:[
  {t:"mcq",q:"My sister wants to be ___ artist.",o:["a","an","the","—"],a:1,e:"artist تبدأ بصوت متحرك ← an."},
  {t:"mcq",q:"Look at ___ moon tonight!",o:["a","an","the","—"],a:2,e:"القمر شيء وحيد معروف ← the."},
  {t:"mcq",q:"I bought ___ new phone yesterday.",o:["a","an","the","—"],a:0,e:"ذكر أول مرة وبصوت ساكن ← a."},
  {t:"gap",q:"He waited for ___ hour.",a:["an"],e:"hour تُنطق بصوت متحرك (حرف h صامت) ← an."},
  {t:"gap",q:"Riyadh is ___ capital of Saudi Arabia.",a:["the"],e:"العاصمة وحيدة ومحددة ← the."},
  {t:"gap",q:"There is ___ big park near my house.",a:["a"],e:"نكرة تبدأ بصوت ساكن ← a."},
  {t:"ord",w:["an","She","interesting","read","book"],a:"She read an interesting book",e:"الأداة تسبق الصفة والاسم: an + interesting + book."},
  {t:"ord",w:["The","is","teacher","classroom","the","in"],a:"The teacher is in the classroom",e:"معرفتان: the teacher و the classroom."}
 ]},

{id:"L5",lvl:"A1",t:"Present simple",ta:"المضارع البسيط",
 intro:"نستخدم المضارع البسيط للعادات والحقائق والجداول الثابتة: ما تفعله كل يوم، وما هو صحيح دائمًا.",
 pts:["مع <span class='hl'>he / she / it</span> نضيف <span class='en'>-s</span> إلى الفعل: <span class='en'>He plays.</span>",
      "الأفعال المنتهية بـ <span class='en'>-o, -ch, -sh, -ss, -x</span> نضيف لها <span class='en'>-es</span>: <span class='en'>goes, watches, finishes</span>.",
      "الفعل المنتهي بـ حرف ساكن + y يتحول إلى <span class='en'>-ies</span>: <span class='en'>study → studies</span>.",
      "النفي والسؤال بـ <span class='hl'>do / does</span>، ويرجع الفعل إلى أصله: <span class='en'>She doesn't play.</span> · <span class='en'>Does she play?</span>"],
 form:{head:["الحالة","الصيغة","مثال"],rows:[["إثبات (he/she/it)","verb + s","She works in a hospital."],["نفي","don't / doesn't + verb","They don't live here."],["سؤال","Do / Does + فاعل + verb","Does he speak English?"]]},
 ex:[["I get up at six o'clock every day.","أستيقظ الساعة السادسة كل يوم."],["Water boils at 100 degrees.","يغلي الماء عند 100 درجة."],["My brother doesn't like fish.","أخي لا يحب السمك."],["Do you play football on Fridays?","هل تلعب كرة القدم أيام الجمعة؟"]],
 mis:[["He don't like coffee.","He doesn't like coffee.","مع he نستخدم doesn't."],["Does she plays tennis?","Does she play tennis?","بعد does يرجع الفعل بدون s."]],
 q:[
  {t:"mcq",q:"My father ___ to work by car.",o:["go","goes","going","gos"],a:1,e:"مع he نضيف -es للفعل go."},
  {t:"mcq",q:"They ___ television in the evening.",o:["watches","watch","watching","is watch"],a:1,e:"they جمع ← بدون s."},
  {t:"mcq",q:"___ your sister study at this school?",o:["Do","Does","Is","Are"],a:1,e:"sister مفردة ← Does."},
  {t:"mcq",q:"Ahmed ___ his homework before dinner.",o:["do","doing","does","done"],a:2,e:"الفعل do مع he يصبح does."},
  {t:"gap",q:"She ___ (study) English every day.",a:["studies"],e:"ساكن + y ← studies."},
  {t:"gap",q:"We ___ not (do) eat meat.",a:["do"],e:"مع we النفي بـ do not."},
  {t:"gap",q:"He ___ (finish) school at two o'clock.",a:["finishes"],e:"الفعل ينتهي بـ sh ← نضيف -es."},
  {t:"ord",w:["doesn't","She","tea","drink"],a:"She doesn't drink tea",e:"الفاعل + doesn't + الفعل المجرد + المفعول."}
 ]},

{id:"L6",lvl:"A1",t:"Adverbs of frequency",ta:"ظروف التكرار",
 intro:"ظروف التكرار تخبرنا كم مرة يحدث الشيء، وهي تلازم المضارع البسيط.",
 pts:["الترتيب من الأكثر إلى الأقل: <span class='en'>always (100%) → usually → often → sometimes → rarely → never (0%)</span>.",
      "موقعها <span class='hl'>قبل الفعل الرئيسي</span>: <span class='en'>I always walk to school.</span>",
      "لكنها تأتي <span class='hl'>بعد</span> فعل to be: <span class='en'>He is never late.</span>",
      "<span class='en'>never</span> تحمل معنى النفي، فلا نجمعها مع not."],
 form:{head:["الموقع","القاعدة","مثال"],rows:[["مع الأفعال العادية","قبل الفعل","She often helps her mother."],["مع am/is/are","بعد الفعل","They are usually busy."],["عبارات التكرار","في آخر الجملة","I play tennis twice a week."]]},
 ex:[["I usually have breakfast at seven.","عادة أتناول الفطور الساعة السابعة."],["He never forgets his books.","لا ينسى كتبه أبدًا."],["We sometimes visit our grandparents.","أحيانًا نزور أجدادنا."],["She is always ready for the lesson.","هي دائمًا مستعدة للدرس."]],
 mis:[["I go always to the club.","I always go to the club.","الظرف قبل الفعل الرئيسي."],["He doesn't never lie.","He never lies.","never وحدها تكفي للنفي."]],
 q:[
  {t:"mcq",q:"Choose the correct sentence:",o:["She always is kind.","She is always kind.","Always she is kind.","She is kind always."],a:1,e:"بعد is يأتي الظرف مباشرة."},
  {t:"mcq",q:"I ___ drink coffee — I don't like it.",o:["always","never","usually","often"],a:1,e:"المعنى نفي تام ← never."},
  {t:"mcq",q:"We ___ go to the park on Fridays. (90%)",o:["never","rarely","usually","sometimes"],a:2,e:"نسبة عالية ← usually."},
  {t:"gap",q:"He ___ (always) arrives early. ضع الظرف في مكانه الصحيح قبل الفعل.",a:["always"],e:"الظرف قبل الفعل الرئيسي arrives."},
  {t:"gap",q:"They are ___ late for class. (never)",a:["never"],e:"بعد are يأتي الظرف."},
  {t:"ord",w:["often","My","cooks","mother","dinner"],a:"My mother often cooks dinner",e:"الفاعل + ظرف التكرار + الفعل."},
  {t:"ord",w:["is","He","busy","sometimes"],a:"He is sometimes busy",e:"بعد فعل to be يأتي الظرف."},
  {t:"ord",w:["a","play","I","week","football","twice"],a:"I play football twice a week",e:"عبارات التكرار تأتي في نهاية الجملة."}
 ]},

{id:"L7",lvl:"A1",t:"Can / can't",ta:"can للقدرة والإذن",
 intro:"can فعل مساعد يعبّر عن القدرة أو الإمكانية أو طلب الإذن.",
 pts:["بعد can يأتي <span class='hl'>الفعل المجرد</span> دائمًا وبدون to: <span class='en'>I can swim.</span>",
      "لا نضيف s مع he / she / it: <span class='en'>He can drive.</span> وليس <span class='en'>cans</span>.",
      "النفي: <span class='en'>cannot = can't</span>. والسؤال: <span class='en'>Can you help me?</span>",
      "للماضي نستخدم <span class='en'>could</span>: <span class='en'>I could read when I was five.</span>"],
 form:{head:["الحالة","الصيغة","مثال"],rows:[["إثبات","can + verb","She can speak three languages."],["نفي","can't + verb","I can't hear you."],["سؤال","Can + فاعل + verb","Can we start now?"]]},
 ex:[["My little brother can ride a bike.","أخي الصغير يستطيع ركوب الدراجة."],["I can't find my keys.","لا أستطيع إيجاد مفاتيحي."],["Can I open the window, please?","هل يمكنني فتح النافذة من فضلك؟"],["Birds can fly but they can't swim well.","الطيور تستطيع الطيران لكنها لا تسبح جيدًا."]],
 mis:[["She cans play the piano.","She can play the piano.","can لا تأخذ s."],["He can to come with us.","He can come with us.","لا نضع to بعد can."]],
 q:[
  {t:"mcq",q:"___ you speak English?",o:["Do","Can","Are","Does"],a:1,e:"سؤال عن القدرة ← Can."},
  {t:"mcq",q:"He ___ swim, so he stays near the beach.",o:["can","can't","cans","doesn't can"],a:1,e:"المعنى: لا يستطيع ← can't."},
  {t:"mcq",q:"We can ___ the answer on page ten.",o:["to find","finds","find","finding"],a:2,e:"بعد can فعل مجرد."},
  {t:"gap",q:"I ___ not lift this box. It's very heavy.",a:["can"],e:"cannot / can't."},
  {t:"gap",q:"___ I ask a question, please?",a:["Can","can","May","may"],e:"طلب الإذن بـ Can أو May."},
  {t:"ord",w:["can","My","cook","sister","well"],a:"My sister can cook well",e:"الفاعل + can + الفعل + الظرف."},
  {t:"ord",w:["can't","We","the","see","board"],a:"We can't see the board",e:"النفي: can't + فعل مجرد."},
  {t:"ord",w:["you","Can","me","help","?"],a:"Can you help me ?",e:"Can + فاعل + فعل مجرد."}
 ]},
{id:"L8",lvl:"A2",t:"Present continuous",ta:"المضارع المستمر ومقارنته بالبسيط",
 intro:"المضارع المستمر يصف ما يحدث الآن أو في هذه الفترة، بينما المضارع البسيط يصف العادة والحقيقة.",
 pts:["التركيب: <span class='hl'>am / is / are + verb-ing</span>.",
      "كلمات دالة: <span class='en'>now, at the moment, today, look!, listen!</span>",
      "قواعد الإملاء: <span class='en'>write → writing · run → running · study → studying</span>.",
      "أفعال الحالة لا تُستخدم في المستمر: <span class='en'>know, like, want, need, understand</span> ← نقول <span class='en'>I know</span> لا <span class='en'>I am knowing</span>."],
 form:{head:["المقارنة","المضارع البسيط","المضارع المستمر"],rows:[["المعنى","عادة أو حقيقة","حدث الآن"],["مثال","She plays tennis every Friday.","She is playing tennis now."],["السؤال","Does she play?","Is she playing?"]]},
 ex:[["Look! The baby is sleeping.","انظر! الطفل نائم."],["I am reading an interesting book these days.","أقرأ كتابًا ممتعًا هذه الأيام."],["He usually walks, but today he is taking the bus.","عادة يمشي، لكنه اليوم يركب الحافلة."],["What are you doing?","ماذا تفعل؟"]],
 mis:[["I am wanting a new bag.","I want a new bag.","want فعل حالة لا يأتي بالمستمر."],["She is play now.","She is playing now.","لا بد من إضافة ing بعد is."]],
 q:[
  {t:"mcq",q:"Be quiet! The students ___ an exam.",o:["take","takes","are taking","is taking"],a:2,e:"حدث يجري الآن وفاعل جمع ← are taking."},
  {t:"mcq",q:"My father ___ to work every day, but today he ___ at home.",o:["is going / works","goes / is working","go / working","goes / works"],a:1,e:"عادة ← goes، والآن ← is working."},
  {t:"mcq",q:"___ she watching TV at the moment?",o:["Does","Do","Is","Are"],a:2,e:"she + المستمر ← Is."},
  {t:"mcq",q:"I ___ this word. Can you explain it?",o:["am not understanding","don't understand","not understand","doesn't understand"],a:1,e:"understand فعل حالة ← المضارع البسيط."},
  {t:"gap",q:"Listen! Someone ___ (knock) at the door.",a:["is knocking"],e:"Listen! إشارة للحدث الآني."},
  {t:"gap",q:"We ___ (have) a party next Friday.",a:["are having"],e:"المضارع المستمر يستخدم لترتيب مستقبلي مؤكد."},
  {t:"ord",w:["is","My","running","dog","the","in","garden"],a:"My dog is running in the garden",e:"الفاعل + is + الفعل ing + شبه الجملة."},
  {t:"ord",w:["you","are","Why","laughing","?"],a:"Why are you laughing ?",e:"أداة الاستفهام + are + الفاعل + الفعل ing."}
 ]},

{id:"L9",lvl:"A2",t:"Past simple",ta:"الماضي البسيط",
 intro:"نستخدم الماضي البسيط لحدث انتهى في وقت محدد في الماضي.",
 pts:["الأفعال المنتظمة تأخذ <span class='hl'>-ed</span>: <span class='en'>play → played · study → studied · stop → stopped</span>.",
      "الأفعال الشاذة يجب حفظها: <span class='en'>go → went · see → saw · eat → ate · buy → bought</span>.",
      "النفي والسؤال بـ <span class='hl'>did</span> ويرجع الفعل لأصله: <span class='en'>I didn't go.</span> · <span class='en'>Did you go?</span>",
      "كلمات دالة: <span class='en'>yesterday, last week, two days ago, in 2019</span>."],
 form:{head:["الحالة","الصيغة","مثال"],rows:[["إثبات","verb + ed / شاذ","We visited my uncle."],["نفي","didn't + verb","She didn't come."],["سؤال","Did + فاعل + verb","Did they win?"]]},
 ex:[["I finished my homework an hour ago.","أنهيت واجبي قبل ساعة."],["We went to Abha last summer.","ذهبنا إلى أبها الصيف الماضي."],["He didn't watch the match.","لم يشاهد المباراة."],["Did you see my pen?","هل رأيت قلمي؟"]],
 mis:[["I didn't went home.","I didn't go home.","بعد didn't يأتي الفعل المجرد."],["Did she bought a book?","Did she buy a book?","بعد did يأتي الفعل المجرد."]],
 q:[
  {t:"mcq",q:"They ___ to the museum last Thursday.",o:["go","goes","went","gone"],a:2,e:"زمن ماضٍ محدد ← went."},
  {t:"mcq",q:"I ___ my homework yesterday evening.",o:["did","do","done","doing"],a:0,e:"ماضي do هو did."},
  {t:"mcq",q:"___ you enjoy the trip?",o:["Do","Did","Was","Were"],a:1,e:"سؤال في الماضي بفعل عادي ← Did."},
  {t:"mcq",q:"She ___ eat breakfast this morning.",o:["doesn't","don't","didn't","wasn't"],a:2,e:"نفي في الماضي ← didn't."},
  {t:"gap",q:"We ___ (study) hard for the exam.",a:["studied"],e:"ساكن + y ← ied."},
  {t:"gap",q:"He ___ (buy) a new bike last month.",a:["bought"],e:"فعل شاذ: buy → bought."},
  {t:"gap",q:"They ___ not (play) football because of the rain.",a:["did"],e:"النفي: did not play."},
  {t:"ord",w:["visited","We","grandfather","our","week","last"],a:"We visited our grandfather last week",e:"الفاعل + الفعل الماضي + المفعول + ظرف الزمان."}
 ]},

{id:"L10",lvl:"A2",t:"Past continuous",ta:"الماضي المستمر",
 intro:"يصف حدثًا كان مستمرًا في لحظة معينة في الماضي، وكثيرًا ما يُقاطع بحدث آخر.",
 pts:["التركيب: <span class='hl'>was / were + verb-ing</span>.",
      "الاستخدام الأشهر: حدث طويل يقاطعه حدث قصير مع <span class='hl'>when</span> و <span class='hl'>while</span>.",
      "<span class='en'>While</span> غالبًا مع المستمر، و<span class='en'>when</span> غالبًا مع البسيط.",
      "مثال: <span class='en'>I was studying when the lights went out.</span>"],
 form:{head:["الحالة","الصيغة","مثال"],rows:[["إثبات","was / were + ing","He was watching TV at nine."],["نفي","wasn't / weren't + ing","They weren't listening."],["سؤال","Was / Were + فاعل + ing","Were you sleeping?"]]},
 ex:[["At 8 o'clock last night I was doing my homework.","الساعة الثامنة ليلة أمس كنت أحل واجبي."],["While she was cooking, the phone rang.","بينما كانت تطبخ، رن الهاتف."],["The children were playing outside.","كان الأطفال يلعبون في الخارج."],["What were you doing when I called?","ماذا كنت تفعل حين اتصلت؟"]],
 mis:[["I was study when he came.","I was studying when he came.","نضيف ing بعد was."],["While I watched TV, my brother called.","While I was watching TV, my brother called.","بعد while نستخدم المستمر عادة."]],
 q:[
  {t:"mcq",q:"We ___ lunch when the guests arrived.",o:["have","were having","was having","had have"],a:1,e:"we ← were + having."},
  {t:"mcq",q:"While he ___ , he lost his keys.",o:["run","was running","were running","runs"],a:1,e:"he ← was running."},
  {t:"mcq",q:"I saw her while she ___ the street.",o:["cross","crossed","was crossing","is crossing"],a:2,e:"حدث مستمر يقاطعه حدث قصير."},
  {t:"gap",q:"They ___ (wait) for the bus at seven o'clock.",a:["were waiting"],e:"they ← were + ing."},
  {t:"gap",q:"It ___ (rain) when we left the house.",a:["was raining"],e:"it ← was + ing."},
  {t:"gap",q:"What ___ you doing at midnight?",a:["were"],e:"مع you نستخدم were."},
  {t:"ord",w:["was","She","when","reading","I","came"],a:"She was reading when I came",e:"الحدث الطويل بالمستمر + when + الحدث القصير بالبسيط."},
  {t:"ord",w:["were","The","playing","boys","garden","the","in"],a:"The boys were playing in the garden",e:"فاعل جمع ← were + ing."}
 ]},

{id:"L11",lvl:"A2",t:"Countable & quantifiers",ta:"المعدود وغير المعدود والكميات",
 intro:"بعض الأسماء تُعد (apple, book) وبعضها لا يُعد (water, rice)، وهذا يغيّر الكلمات التي نستخدمها معها.",
 pts:["غير المعدود يبقى مفردًا دائمًا: <span class='en'>information, money, bread, homework</span>.",
      "<span class='hl'>many</span> مع المعدود، و<span class='hl'>much</span> مع غير المعدود، و<span class='hl'>a lot of</span> مع الاثنين.",
      "<span class='en'>a few</span> مع المعدود، و<span class='en'>a little</span> مع غير المعدود.",
      "<span class='en'>some</span> في الإثبات، و<span class='en'>any</span> في النفي والسؤال."],
 form:{head:["الكلمة","تُستخدم مع","مثال"],rows:[["many / a few","المعدود","many students, a few eggs"],["much / a little","غير المعدود","much sugar, a little water"],["a lot of / some / any","الاثنين","a lot of books, some milk"]]},
 ex:[["How many students are there in your class?","كم طالبًا في فصلك؟"],["I don't have much time today.","ليس لدي وقت كثير اليوم."],["We need a few chairs and a little water.","نحتاج بضعة كراسٍ وقليلًا من الماء."],["Is there any juice in the fridge?","هل يوجد عصير في الثلاجة؟"]],
 mis:[["I have many homeworks.","I have a lot of homework.","homework غير معدود ولا يُجمع."],["There are much cars in the street.","There are many cars in the street.","cars معدود ← many."]],
 q:[
  {t:"mcq",q:"How ___ sugar do you want?",o:["many","much","few","a lot"],a:1,e:"sugar غير معدود ← much."},
  {t:"mcq",q:"There aren't ___ apples left.",o:["much","some","many","a little"],a:2,e:"نفي + معدود ← many."},
  {t:"mcq",q:"She gave me ___ advice about the test.",o:["a few","many","some","an"],a:2,e:"advice غير معدود ← some."},
  {t:"mcq",q:"We have ___ minutes before the bell rings.",o:["a little","much","a few","any"],a:2,e:"minutes معدود ← a few."},
  {t:"gap",q:"I don't drink ___ coffee. (much / many)",a:["much"],e:"coffee غير معدود."},
  {t:"gap",q:"How ___ books did you read? (much / many)",a:["many"],e:"books معدود."},
  {t:"gap",q:"There is ___ milk in the glass. (some / any)",a:["some"],e:"جملة مثبتة ← some."},
  {t:"ord",w:["a","There","water","little","is","the","in","bottle"],a:"There is a little water in the bottle",e:"a little مع غير المعدود water."}
 ]},

{id:"L12",lvl:"A2",t:"Comparatives & superlatives",ta:"المقارنة والتفضيل",
 intro:"نقارن بين شيئين بصيغة المقارنة، ونفضّل واحدًا على مجموعة بصيغة التفضيل.",
 pts:["الصفة القصيرة: <span class='hl'>-er … than</span> و <span class='hl'>the …-est</span>: <span class='en'>tall → taller → the tallest</span>.",
      "الصفة الطويلة (مقطعان فأكثر): <span class='hl'>more … than</span> و <span class='hl'>the most …</span>: <span class='en'>expensive → more expensive</span>.",
      "شاذة: <span class='en'>good → better → the best · bad → worse → the worst · far → further</span>.",
      "للتساوي نستخدم: <span class='en'>as … as</span> مثل <span class='en'>He is as tall as his father.</span>"],
 form:{head:["نوع الصفة","المقارنة","التفضيل"],rows:[["قصيرة (big)","bigger than","the biggest"],["تنتهي بـ y (easy)","easier than","the easiest"],["طويلة (useful)","more useful than","the most useful"]]},
 ex:[["My bag is heavier than yours.","حقيبتي أثقل من حقيبتك."],["This is the most interesting book in the library.","هذا أكثر كتاب ممتع في المكتبة."],["Today is hotter than yesterday.","اليوم أحر من أمس."],["He is the best player in the team.","هو أفضل لاعب في الفريق."]],
 mis:[["She is more taller than me.","She is taller than me.","لا نجمع بين more و -er."],["This is the more beautiful city.","This is the most beautiful city.","التفضيل مع الصفة الطويلة ← the most."]],
 q:[
  {t:"mcq",q:"The Nile is ___ river in the world.",o:["longer","the longest","longest","more long"],a:1,e:"تفضيل مع صفة قصيرة ← the longest."},
  {t:"mcq",q:"Math is ___ than science for me.",o:["difficult","more difficult","most difficult","difficulter"],a:1,e:"صفة طويلة ← more difficult."},
  {t:"mcq",q:"My marks are ___ than last year.",o:["gooder","better","best","more good"],a:1,e:"good شاذة ← better."},
  {t:"mcq",q:"This car is ___ expensive as that one.",o:["so","as","more","than"],a:1,e:"للتساوي ← as … as."},
  {t:"gap",q:"Riyadh is ___ (big) than Abha.",a:["bigger"],e:"صفة قصيرة ← bigger."},
  {t:"gap",q:"She is the ___ (clever) student in the class.",a:["cleverest","most clever"],e:"clever تقبل الصيغتين، والأشهر cleverest."},
  {t:"gap",q:"Winter is ___ (cold) season here.",a:["the coldest"],e:"تفضيل ← the coldest."},
  {t:"ord",w:["is","brother","My","than","taller","me"],a:"My brother is taller than me",e:"المقارنة: -er + than."}
 ]},

{id:"L13",lvl:"A2",t:"Future: will / going to",ta:"المستقبل: will و be going to",
 intro:"كلاهما للمستقبل، لكن الفرق في نية المتحدث ودرجة التخطيط.",
 pts:["<span class='hl'>will</span> لقرار لحظي أو وعد أو توقع: <span class='en'>I'll help you.</span>",
      "<span class='hl'>be going to</span> لخطة مسبقة أو دليل واضح: <span class='en'>I'm going to study medicine.</span>",
      "بعد will يأتي الفعل المجرد دائمًا، والنفي <span class='en'>won't</span>.",
      "دلائل زمنية: <span class='en'>tomorrow, next week, in 2030, soon</span>."],
 form:{head:["الصيغة","الاستخدام","مثال"],rows:[["will + verb","قرار لحظي / توقع","It will rain tomorrow."],["be going to + verb","خطة أو دليل","Look at the clouds! It's going to rain."],["نفي","won't / am not going to","I won't be late."]]},
 ex:[["I think our team will win the match.","أعتقد أن فريقنا سيفوز بالمباراة."],["We are going to visit Makkah next month.","سنزور مكة الشهر القادم."],["Don't worry, I'll carry your bag.","لا تقلق، سأحمل حقيبتك."],["She isn't going to join the club.","لن تنضم إلى النادي."]],
 mis:[["I will to travel next week.","I will travel next week.","بعد will فعل مجرد بدون to."],["He is going travel tomorrow.","He is going to travel tomorrow.","لا بد من to قبل الفعل."]],
 q:[
  {t:"mcq",q:"The phone is ringing. — I ___ answer it.",o:["am going to","will","going to","am"],a:1,e:"قرار لحظي ← will."},
  {t:"mcq",q:"We have tickets. We ___ watch the game on Friday.",o:["will","are going to","go","would"],a:1,e:"خطة مسبقة ← be going to."},
  {t:"mcq",q:"Look at that car! It ___ hit the wall.",o:["will","is going to","goes to","would"],a:1,e:"دليل واضح أمامنا ← going to."},
  {t:"mcq",q:"I promise I ___ tell anyone.",o:["won't","am not going","will","don't"],a:0,e:"وعد منفي ← won't."},
  {t:"gap",q:"They ___ (travel) to Madinah next week. (خطة)",a:["are going to travel"],e:"خطة مرتبة ← be going to."},
  {t:"gap",q:"Maybe it ___ (be) cold tomorrow.",a:["will be"],e:"توقع ← will."},
  {t:"ord",w:["going","am","to","I","study","tonight"],a:"I am going to study tonight",e:"be going to + فعل مجرد."},
  {t:"ord",w:["will","She","the","pass","exam"],a:"She will pass the exam",e:"will + فعل مجرد."}
 ]},

{id:"L14",lvl:"A2",t:"Prepositions of time & place",ta:"حروف الجر: الزمان والمكان",
 intro:"حروف الجر صغيرة لكنها تغيّر المعنى تمامًا، وأشهرها in / on / at.",
 pts:["الزمان: <span class='hl'>at</span> للساعة، <span class='hl'>on</span> لليوم والتاريخ، <span class='hl'>in</span> للشهر والسنة والفصل.",
      "المكان: <span class='hl'>at</span> لنقطة محددة، <span class='hl'>on</span> لسطح، <span class='hl'>in</span> لداخل مكان مغلق.",
      "أخرى مهمة: <span class='en'>under, behind, between, next to, in front of, opposite</span>.",
      "استثناءات تُحفظ: <span class='en'>at night, at the weekend, in the morning</span>."],
 form:{head:["الحرف","الزمان","المكان"],rows:[["at","at 7 o'clock, at night","at the door, at school"],["on","on Sunday, on 5 May","on the table, on the wall"],["in","in July, in 2026","in the box, in Riyadh"]]},
 ex:[["The class starts at eight o'clock.","يبدأ الدرس الساعة الثامنة."],["My birthday is on the tenth of March.","عيد ميلادي في العاشر من مارس."],["We live in a small city in the south.","نسكن في مدينة صغيرة في الجنوب."],["The cat is under the chair.","القطة تحت الكرسي."]],
 mis:[["I wake up in 6 o'clock.","I wake up at 6 o'clock.","الساعة تأخذ at."],["He was born on 2011.","He was born in 2011.","السنة تأخذ in."]],
 q:[
  {t:"mcq",q:"The match begins ___ half past four.",o:["in","on","at","to"],a:2,e:"الساعة ← at."},
  {t:"mcq",q:"We have a holiday ___ Ramadan.",o:["at","in","on","by"],a:1,e:"الشهر ← in."},
  {t:"mcq",q:"My keys are ___ the table.",o:["in","on","at","under"],a:1,e:"على سطح ← on."},
  {t:"mcq",q:"She is standing ___ the two cars.",o:["among","between","in","on"],a:1,e:"بين شيئين اثنين ← between."},
  {t:"gap",q:"I usually study ___ the evening.",a:["in"],e:"in the evening استخدام ثابت."},
  {t:"gap",q:"The party is ___ Friday.",a:["on"],e:"اليوم ← on."},
  {t:"gap",q:"There is a picture ___ the wall.",a:["on"],e:"على الجدار ← on."},
  {t:"ord",w:["in","The","is","pencil","bag","the"],a:"The pencil is in the bag",e:"داخل شيء مغلق ← in."}
 ]},

{id:"L15",lvl:"A2",t:"Modals: must / should / have to",ta:"أفعال الوجوب والنصيحة",
 intro:"هذه الأفعال تعبّر عن الواجب والنصيحة والمنع، وكلها يتبعها فعل مجرد.",
 pts:["<span class='hl'>must</span> واجب قوي من المتحدث نفسه: <span class='en'>I must finish this today.</span>",
      "<span class='hl'>have to</span> واجب من قانون أو ظرف خارجي: <span class='en'>We have to wear uniform.</span>",
      "<span class='hl'>should</span> نصيحة: <span class='en'>You should drink more water.</span>",
      "انتبه: <span class='en'>mustn't</span> تعني المنع، أما <span class='en'>don't have to</span> فتعني لا حاجة."],
 form:{head:["الفعل","المعنى","مثال"],rows:[["must / have to","يجب","Students must be quiet."],["mustn't","ممنوع","You mustn't use your phone in class."],["don't have to","لا داعي","We don't have to come early."]]},
 ex:[["You should revise before the exam.","ينبغي أن تراجع قبل الاختبار."],["Drivers must stop at the red light.","يجب على السائقين التوقف عند الإشارة الحمراء."],["I have to help my mother at home.","عليّ مساعدة أمي في البيت."],["You mustn't run in the corridor.","ممنوع الركض في الممر."]],
 mis:[["You should to sleep early.","You should sleep early.","بعد should فعل مجرد."],["He musts study.","He must study.","must لا تأخذ s."]],
 q:[
  {t:"mcq",q:"You look tired. You ___ go to bed early.",o:["must","should","mustn't","don't have to"],a:1,e:"نصيحة ← should."},
  {t:"mcq",q:"Tomorrow is a holiday, so we ___ wake up early.",o:["mustn't","must","don't have to","should"],a:2,e:"لا حاجة ← don't have to."},
  {t:"mcq",q:"You ___ touch that wire. It's dangerous!",o:["don't have to","mustn't","should","can"],a:1,e:"منع ← mustn't."},
  {t:"mcq",q:"All students ___ wear the school uniform.",o:["have to","has to","having to","to have"],a:0,e:"فاعل جمع ← have to."},
  {t:"gap",q:"He ___ (have to) finish his project today.",a:["has to"],e:"مع he ← has to."},
  {t:"gap",q:"You ___ eat too much sugar. (نصيحة بالنفي)",a:["shouldn't","should not"],e:"نصيحة منفية ← shouldn't."},
  {t:"ord",w:["must","We","the","respect","rules"],a:"We must respect the rules",e:"must + فعل مجرد."},
  {t:"ord",w:["should","You","your","ask","teacher"],a:"You should ask your teacher",e:"should + فعل مجرد."}
 ]},
{id:"L16",lvl:"B1",t:"Present perfect",ta:"المضارع التام ومقارنته بالماضي البسيط",
 intro:"يربط الماضي بالحاضر: تجربة حدثت دون تحديد وقتها، أو فعل بدأ في الماضي وما زال مستمرًا، أو نتيجة ظاهرة الآن.",
 pts:["التركيب: <span class='hl'>have / has + past participle</span> (التصريف الثالث).",
      "<span class='hl'>for</span> لمدة زمنية، و<span class='hl'>since</span> لنقطة بداية: <span class='en'>for two years · since 2020</span>.",
      "كلمات دالة: <span class='en'>ever, never, just, already, yet, so far</span>.",
      "الفرق المهم: مع الوقت المحدد (<span class='en'>yesterday, last week, in 2019</span>) نستخدم <span class='hl'>الماضي البسيط</span> لا التام."],
 form:{head:["الحالة","الصيغة","مثال"],rows:[["إثبات","have / has + V3","I have finished my project."],["نفي","haven't / hasn't + V3","She hasn't called yet."],["سؤال","Have / Has + فاعل + V3","Have you ever been to Dubai?"]]},
 ex:[["I have lived in this city for ten years.","أعيش في هذه المدينة منذ عشر سنوات."],["She has just left the room.","لقد غادرت الغرفة للتو."],["Have you finished your homework yet?","هل أنهيت واجبك بعد؟"],["We visited Cairo last year.","زرنا القاهرة العام الماضي."]],
 mis:[["I have seen him yesterday.","I saw him yesterday.","yesterday وقت محدد ← الماضي البسيط."],["She has went to school.","She has gone to school.","بعد has نستخدم التصريف الثالث gone."]],
 q:[
  {t:"mcq",q:"I ___ never ___ sushi before.",o:["have / eaten","has / ate","have / ate","am / eating"],a:0,e:"تجربة ← have + التصريف الثالث eaten."},
  {t:"mcq",q:"We ___ in this house since 2018.",o:["live","lived","have lived","are living"],a:2,e:"since + بداية ← المضارع التام."},
  {t:"mcq",q:"She ___ her keys, so she can't open the door.",o:["lost","has lost","loses","was losing"],a:1,e:"النتيجة ظاهرة الآن ← has lost."},
  {t:"mcq",q:"___ you ever ___ to London?",o:["Did / go","Have / been","Have / went","Are / being"],a:1,e:"سؤال عن التجربة ← Have you ever been."},
  {t:"gap",q:"He has worked here ___ five years. (for / since)",a:["for"],e:"مدة زمنية ← for."},
  {t:"gap",q:"They ___ (finish) the project already.",a:["have finished"],e:"already مع المضارع التام."},
  {t:"gap",q:"I ___ (watch) that film last night.",a:["watched"],e:"last night وقت محدد ← الماضي البسيط."},
  {t:"ord",w:["has","She","already","the","eaten","cake"],a:"She has already eaten the cake",e:"already بين has والتصريف الثالث."}
 ]},

{id:"L17",lvl:"B1",t:"Conditionals 0 / 1 / 2",ta:"الجمل الشرطية",
 intro:"الجملة الشرطية تربط شرطًا بنتيجة. الفرق بين الأنواع هو درجة الاحتمال.",
 pts:["<span class='hl'>Zero</span> للحقائق: <span class='en'>If you heat ice, it melts.</span> (present + present)",
      "<span class='hl'>First</span> لاحتمال واقعي في المستقبل: <span class='en'>If it rains, we will stay home.</span> (present + will)",
      "<span class='hl'>Second</span> لخيال أو أمر بعيد: <span class='en'>If I had a car, I would drive to school.</span> (past + would)",
      "بعد <span class='hl'>if</span> لا نستخدم will في النوع الأول، ومع الفعل be في النوع الثاني نستخدم <span class='en'>were</span> لكل الضمائر."],
 form:{head:["النوع","جملة if","الجواب"],rows:[["Zero","If + present simple","present simple"],["First","If + present simple","will + verb"],["Second","If + past simple","would + verb"]]},
 ex:[["If you mix red and blue, you get purple.","إذا مزجت الأحمر والأزرق تحصل على البنفسجي."],["If I finish early, I will call you.","إذا انتهيت مبكرًا سأتصل بك."],["If I were you, I would study harder.","لو كنت مكانك لاجتهدت أكثر."],["She won't pass if she doesn't revise.","لن تنجح إذا لم تراجع."]],
 mis:[["If it will rain, we will stay home.","If it rains, we will stay home.","لا نستخدم will بعد if في النوع الأول."],["If I was rich, I would travel.","If I were rich, I would travel.","في النوع الثاني نفضّل were."]],
 q:[
  {t:"mcq",q:"If you ___ hard, you will succeed.",o:["will work","work","worked","working"],a:1,e:"النوع الأول: if + مضارع بسيط."},
  {t:"mcq",q:"If I had more time, I ___ learn the guitar.",o:["will","would","am","did"],a:1,e:"النوع الثاني ← would."},
  {t:"mcq",q:"Water ___ if the temperature falls below zero.",o:["will freeze","freezes","froze","would freeze"],a:1,e:"حقيقة علمية ← النوع الصفري."},
  {t:"mcq",q:"If she ___ me, I would help her.",o:["asks","will ask","asked","is asking"],a:2,e:"النوع الثاني ← ماضٍ بسيط بعد if."},
  {t:"gap",q:"If it ___ (be) sunny tomorrow, we will go out.",a:["is"],e:"النوع الأول: مضارع بعد if."},
  {t:"gap",q:"If I ___ (be) you, I would apologise.",a:["were","was"],e:"الأفضل were في النوع الثاني."},
  {t:"gap",q:"You ___ (miss) the bus if you don't hurry.",a:["will miss"],e:"جواب الشرط في النوع الأول ← will."},
  {t:"ord",w:["would","If","I","had","money","a","buy","I","laptop"],a:"If I had money I would buy a laptop",e:"if + ماضٍ بسيط + would + فعل مجرد."}
 ]},

{id:"L18",lvl:"B1",t:"Passive voice",ta:"المبني للمجهول",
 intro:"نستخدم المبني للمجهول حين يكون الحدث أهم من الفاعل، أو حين يكون الفاعل مجهولًا.",
 pts:["التركيب: <span class='hl'>be + past participle</span> ويتغير be حسب الزمن.",
      "مضارع: <span class='en'>is / are + V3</span> · ماضٍ: <span class='en'>was / were + V3</span>.",
      "نذكر الفاعل بـ <span class='hl'>by</span> عند الحاجة فقط: <span class='en'>The book was written by Ahmed.</span>",
      "خطوات التحويل: المفعول يصير فاعلًا ← نضع be المناسب للزمن ← نضع التصريف الثالث."],
 form:{head:["الزمن","المبني للمعلوم","المبني للمجهول"],rows:[["المضارع البسيط","They clean the rooms.","The rooms are cleaned."],["الماضي البسيط","Someone stole my bike.","My bike was stolen."],["المستقبل","They will build a school.","A school will be built."]]},
 ex:[["English is spoken in many countries.","تُتحدث الإنجليزية في دول كثيرة."],["The windows were broken last night.","كُسرت النوافذ ليلة أمس."],["This mosque was built in 1980.","بُني هذا المسجد عام 1980."],["The results will be announced tomorrow.","ستُعلن النتائج غدًا."]],
 mis:[["The letter was wrote by him.","The letter was written by him.","نستخدم التصريف الثالث written."],["The homework is do every day.","The homework is done every day.","بعد is نستخدم done."]],
 q:[
  {t:"mcq",q:"Rice ___ in many Asian countries.",o:["grows","is grown","grew","is growing"],a:1,e:"الأرز يُزرع ← مبني للمجهول."},
  {t:"mcq",q:"The classroom ___ every morning.",o:["cleans","is cleaned","cleaned","is cleaning"],a:1,e:"is + التصريف الثالث."},
  {t:"mcq",q:"These photos ___ by my brother last week.",o:["took","were taken","are taken","take"],a:1,e:"ماضٍ + جمع ← were taken."},
  {t:"mcq",q:"The new hospital ___ next year.",o:["will open","will be opened","is opened","opens"],a:1,e:"مستقبل مجهول ← will be + V3."},
  {t:"gap",q:"The door ___ (lock) every night.",a:["is locked"],e:"مضارع مجهول ← is + locked."},
  {t:"gap",q:"My bag ___ (steal) yesterday.",a:["was stolen"],e:"ماضٍ مجهول ← was stolen."},
  {t:"ord",w:["was","The","built","bridge","1995","in"],a:"The bridge was built in 1995",e:"was + التصريف الثالث."},
  {t:"ord",w:["are","The","every","lessons","recorded","day"],a:"The lessons are recorded every day",e:"جمع + مضارع ← are + V3."}
 ]},

{id:"L19",lvl:"B1",t:"Relative clauses",ta:"جمل الوصل: who / which / that",
 intro:"جمل الوصل تعطي معلومات إضافية عن الاسم وتربط جملتين في جملة واحدة أنيقة.",
 pts:["<span class='hl'>who</span> للعاقل، <span class='hl'>which</span> لغير العاقل، و<span class='hl'>that</span> للاثنين.",
      "<span class='en'>where</span> للمكان، <span class='en'>whose</span> للملكية، <span class='en'>when</span> للزمان.",
      "ضمير الوصل يأتي <span class='hl'>مباشرة بعد الاسم</span> الذي يصفه.",
      "لا نكرر الضمير: نقول <span class='en'>The man who called me…</span> لا <span class='en'>The man who he called me…</span>"],
 form:{head:["الضمير","يعود على","مثال"],rows:[["who","أشخاص","The teacher who helped me is kind."],["which","أشياء","The book which I read was long."],["where / whose","مكان / ملكية","The city where I was born · the boy whose father is a doctor"]]},
 ex:[["I know a girl who speaks four languages.","أعرف فتاة تتحدث أربع لغات."],["This is the phone which I bought last week.","هذا الهاتف الذي اشتريته الأسبوع الماضي."],["That is the school where my brother studies.","تلك هي المدرسة التي يدرس فيها أخي."],["The man whose car was stolen called the police.","الرجل الذي سُرقت سيارته اتصل بالشرطة."]],
 mis:[["The man which lives next door is nice.","The man who lives next door is nice.","man عاقل ← who."],["This is the book that I read it.","This is the book that I read.","لا نكرر المفعول بعد ضمير الوصل."]],
 q:[
  {t:"mcq",q:"The doctor ___ treated me was very kind.",o:["which","who","where","whose"],a:1,e:"الطبيب عاقل ← who."},
  {t:"mcq",q:"I like films ___ make me think.",o:["who","whose","which","where"],a:2,e:"films غير عاقل ← which."},
  {t:"mcq",q:"This is the restaurant ___ we ate last Friday.",o:["which","who","where","that"],a:2,e:"إشارة إلى مكان ← where."},
  {t:"mcq",q:"She has a friend ___ mother is a pilot.",o:["who","whose","which","whom"],a:1,e:"ملكية ← whose."},
  {t:"gap",q:"The boy ___ won the prize is my cousin.",a:["who","that"],e:"عاقل ← who / that."},
  {t:"gap",q:"I lost the pen ___ my father gave me.",a:["which","that"],e:"غير عاقل ← which / that."},
  {t:"ord",w:["who","The","helped","students","us","are","clever"],a:"The students who helped us are clever",e:"الاسم + who + جملة الوصل + بقية الجملة."},
  {t:"ord",w:["which","This","the","is","house","built","was","1990","in"],a:"This is the house which was built in 1990",e:"which يعود على house."}
 ]},

{id:"L20",lvl:"B1",t:"Reported speech",ta:"الكلام المنقول",
 intro:"حين ننقل كلام شخص آخر نغيّر زمن الفعل خطوة إلى الماضي، ونغيّر الضمائر وكلمات الزمان.",
 pts:["<span class='en'>present simple → past simple</span> · <span class='en'>present continuous → past continuous</span>.",
      "<span class='en'>will → would · can → could · must → had to</span>.",
      "تتغير كلمات الزمان: <span class='en'>today → that day · tomorrow → the next day · now → then</span>.",
      "في السؤال المنقول نرجع إلى <span class='hl'>ترتيب الجملة الخبرية</span>: <span class='en'>He asked where I lived.</span>"],
 form:{head:["الكلام المباشر","الكلام المنقول","ملاحظة"],rows:[["\"I am tired.\"","He said (that) he was tired.","مضارع ← ماضٍ"],["\"I will come.\"","She said she would come.","will ← would"],["\"Where do you live?\"","He asked where I lived.","بدون do وبترتيب خبري"]]},
 ex:[["He said that he liked football.","قال إنه يحب كرة القدم."],["She told me she was studying.","أخبرتني أنها كانت تدرس."],["They said they would help us.","قالوا إنهم سيساعدوننا."],["The teacher asked if we had finished.","سأل المعلم إن كنا قد انتهينا."]],
 mis:[["He said he is busy.","He said he was busy.","نرجع الزمن خطوة للماضي."],["She asked where do I live.","She asked where I lived.","السؤال المنقول بترتيب خبري بدون do."]],
 q:[
  {t:"mcq",q:"\"I am hungry,\" he said. → He said he ___ hungry.",o:["is","was","were","has been"],a:1,e:"am ← was."},
  {t:"mcq",q:"\"We will travel,\" they said. → They said they ___ travel.",o:["will","would","were","are"],a:1,e:"will ← would."},
  {t:"mcq",q:"\"Do you speak French?\" she asked. → She asked if I ___ French.",o:["speak","spoke","speaking","do speak"],a:1,e:"مضارع ← ماضٍ، وبترتيب خبري."},
  {t:"mcq",q:"\"I can swim,\" he said. → He said he ___ swim.",o:["can","could","would","must"],a:1,e:"can ← could."},
  {t:"gap",q:"\"I live in Jeddah,\" she said. → She said she ___ (live) in Jeddah.",a:["lived"],e:"مضارع بسيط ← ماضٍ بسيط."},
  {t:"gap",q:"\"I am reading,\" he said. → He said he ___ (read).",a:["was reading"],e:"مضارع مستمر ← ماضٍ مستمر."},
  {t:"ord",w:["said","He","he","tired","was"],a:"He said he was tired",e:"said + الفاعل + الفعل في الماضي."},
  {t:"ord",w:["asked","She","I","where","lived"],a:"She asked where I lived",e:"السؤال المنقول بترتيب خبري."}
 ]},

{id:"L21",lvl:"B1",t:"Gerunds & infinitives",ta:"المصدر: ing أو to",
 intro:"بعض الأفعال يتبعها فعل بصيغة ing، وبعضها يتبعها to + فعل مجرد. المسألة سماعية غالبًا لكن لها قواعد مساعدة.",
 pts:["بعد حروف الجر نستخدم <span class='hl'>ing</span> دائمًا: <span class='en'>good at drawing · interested in learning</span>.",
      "أفعال تأخذ ing: <span class='en'>enjoy, finish, avoid, suggest, mind, practise, keep</span>.",
      "أفعال تأخذ to: <span class='en'>want, decide, hope, need, promise, learn, agree</span>.",
      "تأخذ الاثنين بمعنى قريب: <span class='en'>like, love, hate, start, begin</span>."],
 form:{head:["النوع","أمثلة أفعال","مثال"],rows:[["verb + ing","enjoy, finish, avoid","I enjoy playing chess."],["verb + to","want, decide, hope","She decided to leave."],["preposition + ing","at, of, about, in","He is good at swimming."]]},
 ex:[["I enjoy reading before bed.","أستمتع بالقراءة قبل النوم."],["We decided to visit our uncle.","قررنا زيارة عمنا."],["She is afraid of flying.","تخاف من الطيران."],["He finished doing his homework.","أنهى حل واجبه."]],
 mis:[["I enjoy to read.","I enjoy reading.","enjoy يتبعها ing."],["She wants going home.","She wants to go home.","want يتبعها to."]],
 q:[
  {t:"mcq",q:"They want ___ a new car.",o:["buy","buying","to buy","bought"],a:2,e:"want + to + فعل."},
  {t:"mcq",q:"I don't mind ___ early.",o:["get up","to get up","getting up","got up"],a:2,e:"mind + ing."},
  {t:"mcq",q:"She is interested in ___ languages.",o:["learn","learning","to learn","learned"],a:1,e:"بعد حرف الجر in نستخدم ing."},
  {t:"mcq",q:"He promised ___ on time.",o:["coming","to come","come","came"],a:1,e:"promise + to."},
  {t:"gap",q:"We finished ___ (paint) the room.",a:["painting"],e:"finish + ing."},
  {t:"gap",q:"He hopes ___ (win) the competition.",a:["to win"],e:"hope + to."},
  {t:"gap",q:"Thank you for ___ (help) me.",a:["helping"],e:"for حرف جر ← ing."},
  {t:"ord",w:["enjoys","She","music","listening","to"],a:"She enjoys listening to music",e:"enjoy + ing، ثم listen to."}
 ]}
];
LESSONS.push(
{id:"L22",lvl:"B2",t:"Past perfect & narrative tenses",ta:"الماضي التام وترتيب أحداث الماضي",
 intro:"حين نروي حدثين في الماضي، نستخدم الماضي التام للحدث <b>الأسبق</b> والماضي البسيط للحدث اللاحق. هذا ما يجعل القصة مرتبة ومفهومة.",
 pts:["التركيب: <span class='hl'>had + past participle</span> لكل الضمائر.",
      "كلمات دالة: <span class='en'>before, after, by the time, already, as soon as, when</span>.",
      "الماضي التام المستمر: <span class='hl'>had been + ing</span> لمدة استمرت قبل حدث ماضٍ: <span class='en'>She had been waiting for an hour when the bus arrived.</span>",
      "لا نستخدم الماضي التام إلا إذا كان هناك حدثان؛ الحدث المفرد يكفيه الماضي البسيط."],
 form:{head:["الوظيفة","الصيغة","مثال"],rows:[["الحدث الأسبق","had + V3","The match had started when we arrived."],["مدة قبل حدث ماضٍ","had been + V-ing","He had been studying for hours before he slept."],["نفي / سؤال","hadn't + V3 / Had + فاعل + V3","Had you met him before?"]]},
 ex:[["By the time the teacher came in, the students had finished the task.","بحلول وقت دخول المعلم، كان الطلاب قد أنهوا المهمة."],["I couldn't enter because I had forgotten my ID.","لم أستطع الدخول لأنني كنت قد نسيت هويتي."],["She had never travelled abroad before that summer.","لم تكن قد سافرت للخارج قبل ذلك الصيف."],["They had been playing for ten minutes when it started to rain.","كانوا يلعبون منذ عشر دقائق حين بدأ المطر."]],
 mis:[["When I arrived, the train already left.","When I arrived, the train had already left.","الحدث الأسبق يحتاج had + V3."],["He had went home early.","He had gone home early.","بعد had نستخدم التصريف الثالث gone."]],
 q:[
  {t:"mcq",q:"By the time we got to the cinema, the film ___.",o:["started","has started","had started","was starting"],a:2,e:"الحدث وقع قبل وصولنا ← had started."},
  {t:"mcq",q:"She was tired because she ___ all night.",o:["studied","had been studying","has studied","was study"],a:1,e:"مدة استمرت قبل حالة ماضية ← had been studying."},
  {t:"mcq",q:"After he ___ the email, he deleted it.",o:["read","had read","has read","was reading"],a:1,e:"after + الحدث الأسبق في الماضي التام."},
  {t:"mcq",q:"I didn't recognise her because I ___ her before.",o:["didn't meet","haven't met","hadn't met","wasn't meeting"],a:2,e:"نفي حدث أسبق ← hadn't met."},
  {t:"gap",q:"When we arrived, the guests ___ (leave) already.",a:["had left"],e:"غادروا قبل وصولنا ← had left."},
  {t:"gap",q:"He ___ (not / finish) his homework before the bell rang.",a:["hadn't finished","had not finished"],e:"نفي في الماضي التام."},
  {t:"ord",w:["had","She","when","left","police","arrived","the"],a:"She had left when the police arrived",e:"الحدث الأسبق بـ had + V3، واللاحق بالماضي البسيط."},
  {t:"ord",w:["had","They","waiting","been","hours","for","two"],a:"They had been waiting for two hours",e:"had been + ing للمدة المستمرة في الماضي."}
 ]},

{id:"L23",lvl:"B2",t:"Present perfect continuous",ta:"المضارع التام المستمر",
 intro:"نستخدمه للتركيز على <b>استمرار الفعل ومدته</b> حتى الآن، بينما المضارع التام البسيط يركّز على النتيجة أو العدد.",
 pts:["التركيب: <span class='hl'>have / has been + V-ing</span>.",
      "يركّز على المدة: <span class='en'>I've been studying for three hours.</span> (ما زلت أو انتهيت للتو)",
      "المضارع التام البسيط يركّز على الإنجاز المكتمل أو الكمية: <span class='en'>I've written three emails.</span>",
      "أفعال الحالة (<span class='en'>know, be, own, believe</span>) لا تُستخدم في المستمر."],
 form:{head:["الصيغة","التركيز","مثال"],rows:[["have been + ing","المدة والاستمرار","She has been working since 8 a.m."],["have + V3","النتيجة أو العدد","She has finished two reports."],["سؤال المدة","How long have you been…?","How long have you been learning English?"]]},
 ex:[["My eyes hurt because I have been reading all day.","عيناي تؤلمانني لأنني كنت أقرأ طوال اليوم."],["It has been raining since morning.","تمطر منذ الصباح."],["How long have you been waiting?","منذ متى وأنت تنتظر؟"],["He has been trying to fix the printer, but it still doesn't work.","ظل يحاول إصلاح الطابعة، لكنها ما زالت لا تعمل."]],
 mis:[["I am knowing him since 2015.","I have known him since 2015.","know فعل حالة ← المضارع التام البسيط."],["She has been finishing the book.","She has finished the book.","الإنجاز المكتمل يحتاج الصيغة البسيطة."]],
 q:[
  {t:"mcq",q:"You look exhausted! What ___ ?",o:["have you done","have you been doing","did you do","are you doing"],a:1,e:"التركيز على نشاط استمر وأثره ظاهر."},
  {t:"mcq",q:"She ___ three cups of coffee today.",o:["has been drinking","has drunk","is drinking","drinks"],a:1,e:"عدد محدد ← المضارع التام البسيط."},
  {t:"mcq",q:"We ___ for this exam since last month.",o:["prepare","are preparing","have been preparing","had prepared"],a:2,e:"since + مدة مستمرة حتى الآن."},
  {t:"mcq",q:"I ___ this laptop for five years and it still works.",o:["have been owning","own","have owned","am owning"],a:2,e:"own فعل حالة ← have owned."},
  {t:"gap",q:"How long ___ you been living here?",a:["have"],e:"سؤال عن المدة ← have you been living."},
  {t:"gap",q:"He ___ (work) on the project all week and it is nearly done.",a:["has been working"],e:"نشاط مستمر طوال الأسبوع."},
  {t:"ord",w:["been","She","has","English","studying","years","for","three"],a:"She has been studying English for three years",e:"has been + ing + for + المدة."},
  {t:"ord",w:["have","They","arrived","just"],a:"They have just arrived",e:"just مع المضارع التام البسيط للحدث المكتمل للتو."}
 ]},

{id:"L24",lvl:"B2",t:"Third & mixed conditionals, wish",ta:"الشرط الثالث والمختلط و wish",
 intro:"الشرط الثالث يتحدث عن ماضٍ لم يقع ونتيجته المتخيلة، أما المختلط فيربط ماضيًا متخيلًا بنتيجة في الحاضر. و wish للتمني والندم.",
 pts:["الشرط الثالث: <span class='hl'>If + had + V3, would have + V3</span>.",
      "المختلط: <span class='hl'>If + had + V3, would + verb</span> (ماضٍ ← حاضر).",
      "<span class='en'>wish + past simple</span> لتمنٍّ في الحاضر، و<span class='en'>wish + had + V3</span> للندم على الماضي.",
      "<span class='en'>If only</span> أقوى من wish في التعبير عن الندم."],
 form:{head:["النوع","التركيب","مثال"],rows:[["الثالث","If + had V3 → would have V3","If I had studied, I would have passed."],["المختلط","If + had V3 → would + verb","If I had taken the job, I would be rich now."],["التمني","wish + past / had V3","I wish I knew the answer. · I wish I had asked."]]},
 ex:[["If she had left earlier, she wouldn't have missed the flight.","لو غادرت مبكرًا لما فاتتها الرحلة."],["If we had saved money, we would be travelling now.","لو كنا وفّرنا المال لكنا مسافرين الآن."],["I wish I had studied harder last year.","ليتني اجتهدت أكثر العام الماضي."],["If only I could speak French fluently.","ليتني أستطيع التحدث بالفرنسية بطلاقة."]],
 mis:[["If I would have known, I would have called.","If I had known, I would have called.","لا نضع would بعد if في جملة الشرط."],["I wish I would be taller.","I wish I were taller.","التمني في الحاضر ← wish + past simple."]],
 q:[
  {t:"mcq",q:"If they ___ the map, they wouldn't have got lost.",o:["had taken","took","have taken","would take"],a:0,e:"الشرط الثالث: if + had + V3."},
  {t:"mcq",q:"She would have called you if she ___ your number.",o:["has","had had","would have","has had"],a:1,e:"had had = التصريف الثالث للفعل have."},
  {t:"mcq",q:"I wish I ___ that message — it was rude.",o:["didn't send","hadn't sent","wouldn't send","don't send"],a:1,e:"ندم على الماضي ← wish + hadn't + V3."},
  {t:"mcq",q:"If he hadn't broken his leg, he ___ in the team today.",o:["would have been","will be","would be","had been"],a:2,e:"شرط مختلط: ماضٍ متخيل ← نتيجة حاضرة."},
  {t:"gap",q:"If I ___ (know) about the test, I would have revised.",a:["had known"],e:"الشرط الثالث."},
  {t:"gap",q:"I wish I ___ (can) drive. (تمنٍّ في الحاضر)",a:["could"],e:"wish + could للقدرة المتمناة الآن."},
  {t:"ord",w:["would","If","had","we","have","left","arrived","earlier","we","on","time"],a:"If we had left earlier we would have arrived on time",e:"if + had V3 ← would have V3."},
  {t:"ord",w:["wish","I","asked","had","I","for","help"],a:"I wish I had asked for help",e:"wish + had + V3 للندم."}
 ]},

{id:"L25",lvl:"B2",t:"Advanced passive",ta:"المبني للمجهول المتقدم",
 intro:"في المستويات المتقدمة يظهر المجهول مع الأزمنة التامة والأفعال الناقصة، ومع تراكيب نقل الآراء الشائعة في الأخبار والمقالات.",
 pts:["مع الأزمنة التامة: <span class='hl'>has / had been + V3</span>.",
      "مع الأفعال الناقصة: <span class='hl'>modal + be + V3</span> مثل <span class='en'>must be done, can be seen, should have been sent</span>.",
      "نقل الرأي العام: <span class='en'>It is said that he is rich.</span> = <span class='en'>He is said to be rich.</span>",
      "المجهول بمفعولين: <span class='en'>I was given a prize.</span> / <span class='en'>A prize was given to me.</span>"],
 form:{head:["التركيب","الصيغة","مثال"],rows:[["تام مجهول","has/had been + V3","The road has been closed."],["ناقص مجهول","modal + be + V3","The form must be signed today."],["نقل رأي","It is believed that… / … is believed to…","The ruins are believed to be ancient."]]},
 ex:[["All the tickets have been sold.","بيعت كل التذاكر."],["This problem should have been solved last week.","كان ينبغي حل هذه المشكلة الأسبوع الماضي."],["It is thought that the fire started in the kitchen.","يُعتقد أن الحريق بدأ في المطبخ."],["He was offered a scholarship.","عُرضت عليه منحة دراسية."]],
 mis:[["The report must sent today.","The report must be sent today.","لا بد من be بعد الفعل الناقص."],["The house has been build recently.","The house has been built recently.","نستخدم التصريف الثالث built."]],
 q:[
  {t:"mcq",q:"The results ___ yet.",o:["haven't announced","haven't been announced","didn't announce","aren't announcing"],a:1,e:"تام مجهول منفي ← haven't been announced."},
  {t:"mcq",q:"Your application ___ before Friday.",o:["must submit","must be submitted","must been submitted","must submitting"],a:1,e:"modal + be + V3."},
  {t:"mcq",q:"It ___ that the company will close two branches.",o:["is reported","reports","has reported","is reporting"],a:0,e:"تركيب نقل الرأي: It is reported that…"},
  {t:"mcq",q:"The bridge ___ by the storm before the engineers arrived.",o:["was damaged","had been damaged","has damaged","damaged"],a:1,e:"حدث أسبق ومجهول ← had been damaged."},
  {t:"gap",q:"The letter should ___ (send) yesterday.",a:["have been sent"],e:"لوم على الماضي ← should have been + V3."},
  {t:"gap",q:"English ___ (speak) in more than fifty countries.",a:["is spoken"],e:"حقيقة عامة ← مجهول مضارع."},
  {t:"ord",w:["has","The","been","museum","recently","renovated"],a:"The museum has been recently renovated",e:"has been + V3."},
  {t:"ord",w:["is","She","to","said","be","doctor","a","brilliant"],a:"She is said to be a brilliant doctor",e:"تركيب: subject + is said to + فعل مجرد."}
 ]},

{id:"L26",lvl:"B2",t:"Reporting verbs",ta:"أفعال النقل المتقدمة",
 intro:"بدل تكرار said و told، يستخدم المتحدث المتقدم أفعالًا تحمل معنى دقيقًا: نصح، اقترح، اعترف، أنكر، حذّر. لكل فعل تركيب خاص يجب حفظه.",
 pts:["<span class='hl'>verb + to + inf</span>: <span class='en'>offer, promise, refuse, agree, threaten</span>.",
      "<span class='hl'>verb + object + to + inf</span>: <span class='en'>advise, ask, tell, warn, encourage, remind</span>.",
      "<span class='hl'>verb + V-ing</span>: <span class='en'>suggest, admit, deny, recommend, mention</span>.",
      "<span class='hl'>verb + preposition + V-ing</span>: <span class='en'>apologise for, insist on, accuse sb of, congratulate sb on</span>."],
 form:{head:["النمط","أفعال","مثال"],rows:[["+ to inf","promise, refuse","He refused to answer."],["+ obj + to inf","advise, warn","She advised me to rest."],["+ V-ing","suggest, deny","They denied taking the money."]]},
 ex:[["He admitted breaking the window.","اعترف بأنه كسر النافذة."],["The teacher encouraged us to ask questions.","شجعنا المعلم على طرح الأسئلة."],["She apologised for arriving late.","اعتذرت عن تأخرها."],["They suggested meeting after school.","اقترحوا اللقاء بعد المدرسة."]],
 mis:[["He suggested to go to the park.","He suggested going to the park.","suggest يتبعه ing أو that + should."],["She advised to take a taxi me.","She advised me to take a taxi.","advise يحتاج مفعولًا قبل to."]],
 q:[
  {t:"mcq",q:"My father warned me ___ alone at night.",o:["to not walk","not to walk","don't walk","not walking"],a:1,e:"warn + مفعول + not to + فعل."},
  {t:"mcq",q:"She denied ___ the message.",o:["to send","send","sending","sent"],a:2,e:"deny + V-ing."},
  {t:"mcq",q:"He apologised ___ late.",o:["to be","for being","being","of being"],a:1,e:"apologise for + V-ing."},
  {t:"mcq",q:"They promised ___ the work on time.",o:["finishing","to finish","finish","of finishing"],a:1,e:"promise + to + فعل."},
  {t:"gap",q:"The doctor recommended ___ (drink) more water.",a:["drinking"],e:"recommend + V-ing."},
  {t:"gap",q:"He insisted ___ paying for the meal.",a:["on"],e:"insist on + V-ing."},
  {t:"ord",w:["us","She","wait","to","asked"],a:"She asked us to wait",e:"ask + مفعول + to + فعل."},
  {t:"ord",w:["admitted","He","the","breaking","rule"],a:"He admitted breaking the rule",e:"admit + V-ing."}
 ]},

{id:"L27",lvl:"B2",t:"Modals of deduction",ta:"أفعال الاستنتاج والتوقع",
 intro:"نستخدم الأفعال الناقصة للتعبير عن درجة يقيننا: شبه مؤكد، محتمل، أو مستحيل — في الحاضر وفي الماضي.",
 pts:["يقين شبه تام: <span class='hl'>must + verb</span> / في الماضي <span class='hl'>must have + V3</span>.",
      "احتمال: <span class='en'>may / might / could + verb</span> · في الماضي <span class='en'>might have + V3</span>.",
      "استحالة: <span class='hl'>can't + verb</span> / <span class='hl'>can't have + V3</span> (لا نستخدم mustn't للاستنتاج).",
      "لوم أو ندم: <span class='en'>should have + V3</span> = كان ينبغي أن…"],
 form:{head:["الدرجة","الحاضر","الماضي"],rows:[["شبه مؤكد","He must be at home.","He must have forgotten."],["محتمل","She might be busy.","She might have left."],["مستحيل","That can't be true.","He can't have seen us."]]},
 ex:[["The lights are off — they must be asleep.","الأنوار مطفأة، لا بد أنهم نائمون."],["He didn't answer; he might have been driving.","لم يرد، ربما كان يقود."],["You can't have finished already! It's only been ten minutes.","مستحيل أن تكون انتهيت! مرت عشر دقائق فقط."],["I should have revised more before the test.","كان ينبغي أن أراجع أكثر قبل الاختبار."]],
 mis:[["He mustn't be the new teacher.","He can't be the new teacher.","نفي الاستنتاج بـ can't لا mustn't."],["She must forgot her keys.","She must have forgotten her keys.","الاستنتاج في الماضي ← must have + V3."]],
 q:[
  {t:"mcq",q:"Sara isn't answering. She ___ in class right now.",o:["can't be","must be","should be","mustn't be"],a:1,e:"استنتاج شبه مؤكد ← must be."},
  {t:"mcq",q:"You ___ hungry — you have just eaten!",o:["must be","can't be","might be","should be"],a:1,e:"استحالة ← can't be."},
  {t:"mcq",q:"The ground is wet. It ___ last night.",o:["must rain","must have rained","should rain","can rain"],a:1,e:"استنتاج عن الماضي ← must have + V3."},
  {t:"mcq",q:"I ___ my phone at school — I'm not sure.",o:["must leave","can't have left","might have left","should leave"],a:2,e:"احتمال في الماضي ← might have + V3."},
  {t:"gap",q:"He looks pale. He ___ (must) be ill.",a:["must"],e:"استنتاج قوي في الحاضر."},
  {t:"gap",q:"You ___ (should) have told me earlier!",a:["should"],e:"لوم على تصرف ماضٍ."},
  {t:"ord",w:["have","They","left","must","already"],a:"They must have already left",e:"must have + already + V3."},
  {t:"ord",w:["can't","She","seen","have","us"],a:"She can't have seen us",e:"نفي الاستنتاج في الماضي."}
 ]},

{id:"L28",lvl:"B2",t:"Non-defining relative clauses",ta:"جمل الوصل غير المعرِّفة",
 intro:"الجملة المعرِّفة ضرورية لتحديد الاسم، وغير المعرِّفة تضيف معلومة إضافية بين فاصلتين ويمكن حذفها دون فقدان المعنى.",
 pts:["غير المعرِّفة توضع بين <span class='hl'>فاصلتين</span> ولا تستخدم <span class='en'>that</span> أبدًا.",
      "لا يجوز حذف ضمير الوصل في غير المعرِّفة: <span class='en'>My uncle, who lives in Jeddah, is a pilot.</span>",
      "في المعرِّفة يجوز حذف الضمير إذا كان مفعولًا: <span class='en'>The book (that) I read…</span>",

{id:"L29",lvl:"B2",t:"Verb patterns with meaning change",ta:"أنماط الأفعال التي يتغير معناها",

{id:"L30",lvl:"B2",t:"Linking & contrast",ta:"أدوات الربط والتضاد",
 intro:"أدوات الربط تحوّل الجمل المتقطعة إلى نص متماسك، وهي أهم ما يرفع تقييم الكتابة في المستويات المتقدمة.",
 pts:["<span class='hl'>although / even though / though</span> + جملة كاملة: <span class='en'>Although it was late, he kept working.</span>",
      "<span class='hl'>despite / in spite of</span> + اسم أو V-ing: <span class='en'>Despite the rain, we played.</span>",
      "<span class='hl'>however / nevertheless</span> تبدأ جملة جديدة وبعدها فاصلة.",
      "<span class='en'>whereas / while</span> للمقارنة بين طرفين، و<span class='en'>therefore / as a result</span> للنتيجة، و<span class='en'>moreover / in addition</span> للإضافة."],

{id:"R2",lvl:"B1",t:"Twenty Minutes a Day",ta:"عشرون دقيقة يوميًا",
 mins:2,
 text:["Many learners believe that studying a language requires long hours. Research on memory suggests the opposite: short, regular sessions work better than rare, exhausting ones.",
 "The reason is a process called spaced repetition. When you review a word shortly before you are about to forget it, your brain marks that word as important and stores it more deeply. Reviewing the same list ten times in one evening does not have the same effect.",
 "Practically, this means twenty focused minutes a day can beat three hours on Friday. It also helps to mix skills: five minutes of listening, ten minutes of reading, and five minutes of writing sentences with new words.",
 "Finally, do not be afraid of mistakes. Learners who speak early and make errors usually progress faster than those who wait until they feel perfectly ready, because every corrected mistake is a memory that lasts."],
 gloss:[["exhausting","مرهق"],["spaced repetition","التكرار المتباعد"],["deeply","بعمق"],["progress","يتقدم"],["corrected","مصحَّح"]],

  {t:"mcq",q:"Spaced repetition works because:",o:["it takes less time in total.","the brain treats nearly-forgotten words as important.","it is easier than writing.","it removes the need for review."],a:1,e:"النص يشرح أن المراجعة قبيل النسيان تجعل الدماغ يخزن الكلمة بعمق."},
  {t:"mcq",q:"According to the writer, twenty minutes a day:",o:["is a waste of time","can be better than three hours once a week","should only be reading","is only for beginners"],a:1,e:"ورد بوضوح أن عشرين دقيقة يوميًا تتفوق على ثلاث ساعات يوم الجمعة."},

{id:"R3",lvl:"B2",t:"Why We Forget",ta:"لماذا ننسى؟",
 mins:3,
 text:["Forgetting is usually treated as a failure of the mind, yet psychologists increasingly describe it as a feature rather than a fault. A brain that stored every detail of every day would struggle to find the information that actually matters.",
 "Experiments carried out since the nineteenth century show that most newly learned material disappears within days unless it is revisited. What survives is rarely the information we repeated most often; it is the information we used. Explaining an idea to a classmate, for instance, strengthens memory far more effectively than reading the same page five times.",
 "Sleep plays an equally decisive role. During deep sleep the brain replays recent experiences and transfers selected memories into long-term storage. Students who sacrifice sleep in order to revise are therefore removing the very process that would have saved their revision.",
 "None of this means that effort is unnecessary. It means that effort should be distributed intelligently: retrieve rather than re-read, teach rather than highlight, and treat sleep as part of studying instead of a reward for it."],
 gloss:[["feature","خاصية مقصودة"],["revisited","يُعاد إليه"],["decisive","حاسم"],["sacrifice","يضحّي بـ"],["retrieve","يستدعي من الذاكرة"]],
 q:[
  {t:"mcq",q:"How do psychologists now view forgetting?",o:["As a serious illness","As a useful feature of the mind","As proof of low intelligence","As something that never happens"],a:1,e:"النص يقول إنهم يصفونه بأنه خاصية لا عيب."},
  {t:"mcq",q:"According to the text, what survives in memory?",o:["Information repeated most often","Information that was used or explained","Information written in colour","Information learned at night"],a:1,e:"الفقرة الثانية: ما نستخدمه — كشرحه لزميل — لا ما نكرره فقط."},
  {t:"mcq",q:"Why is losing sleep to revise counterproductive?",o:["Because tired students read slowly","Because sleep transfers memories to long-term storage","Because teachers forbid it","Because revision is useless anyway"],a:1,e:"النوم العميق ينقل الذكريات إلى التخزين طويل المدى."},
  {t:"mcq",q:"“Retrieve rather than re-read” suggests students should:",o:["test themselves from memory","read the text twice","copy notes neatly","study with music"],a:0,e:"retrieve = استدعاء المعلومة من الذاكرة، أي اختبار النفس."},
  {t:"mcq",q:"Which statement would the writer most likely agree with?",o:["Highlighting a textbook is the best study method.","Studying all night before an exam is efficient.","Quality and timing of study matter more than raw hours.","Memory cannot be improved."],a:2,e:"خلاصة النص: توزيع الجهد بذكاء أهم من عدد الساعات."}

{id:"R4",lvl:"B2",t:"The Real Price of Fast Fashion",ta:"الثمن الحقيقي للموضة السريعة",
 mins:3,
 text:["A T-shirt that costs less than a sandwich seems like a bargain. Yet the price on the label tells only part of the story, because someone, somewhere, is paying the difference.",
 "Producing a single cotton shirt consumes roughly 2,700 litres of water — enough for one person to drink for nearly three years. Dyeing factories in some countries release chemicals directly into rivers, and the textile industry is responsible for a larger share of global emissions than international flights.",
 "The human cost is equally hidden. Fast fashion depends on extremely short production cycles, which puts pressure on workers to accept long hours and low wages. When a brand demands a new collection every two weeks, that pressure travels down the supply chain.",
 "Consumers are not powerless, however. Buying fewer but better-made clothes, repairing rather than replacing, and choosing second-hand items all reduce demand. Change will not come from guilt; it will come from habits that are, in the end, cheaper for the buyer as well."],
 gloss:[["bargain","صفقة رابحة"],["consumes","يستهلك"],["emissions","انبعاثات"],["supply chain","سلسلة الإمداد"],["second-hand","مستعمل"]],
 q:[
  {t:"mcq",q:"What does “someone, somewhere, is paying the difference” mean?",o:["Shops lose money on cheap clothes.","The real costs are carried by workers and the environment.","Customers pay extra taxes.","Prices will rise next year."],a:1,e:"الجملة تمهّد لشرح التكلفة البيئية والبشرية المخفية."},
  {t:"mcq",q:"The water figure (2,700 litres) is used to show:",o:["how cheap cotton is","the scale of hidden resource use","that drinking water is unsafe","that shirts last three years"],a:1,e:"الرقم يوضح حجم استهلاك الموارد الخفي."},
  {t:"mcq",q:"Why do short production cycles harm workers?",o:["They reduce the number of shops.","They create pressure for long hours and low pay.","They make clothes heavier.","They increase transport costs only."],a:1,e:"النص يربط الدورات القصيرة بالضغط على العمال."},
  {t:"mcq",q:"The writer's suggested solution is based on:",o:["banning all clothing factories","feeling guilty about shopping","changing buying habits","increasing prices by law"],a:2,e:"الفقرة الأخيرة تدعو لتغيير العادات لا الشعور بالذنب."},
  {t:"mcq",q:"The phrase “Consumers are not powerless” introduces:",o:["a contrast with the previous problems","an example of pollution","a historical fact","a warning about prices"],a:0,e:"تبدأ فقرة الحلول متضادة مع فقرات المشكلات."}
 ]},

{id:"R5",lvl:"C1",t:"Attention in the Age of Screens",ta:"الانتباه في عصر الشاشات",
 mins:4,
 text:["It has become fashionable to claim that technology has destroyed our ability to concentrate. The claim is convenient, but it is also too simple. Attention has not disappeared; it has been redirected, and understanding that distinction matters for anyone who wants to study effectively.",
 "Modern platforms are engineered around a measurable goal: time on screen. Every notification, autoplay and infinite scroll exists because it reliably interrupts whatever a user intended to do. The problem, then, is not weak willpower but an environment designed by teams of specialists to defeat it.",
 "Research on task-switching offers a useful correction to the myth of multitasking. Each switch between a text message and a paragraph of homework carries a cost, and the cost is not only the seconds lost. The mind continues to process the abandoned task, so the student returns with reduced capacity — a phenomenon known as attention residue.",
 "The practical conclusion is unglamorous. Instead of relying on discipline, successful students change their surroundings: the phone leaves the room, notifications are switched off, and work happens in protected blocks of forty minutes. Willpower is finite; architecture is not."],
 gloss:[["redirected","أُعيد توجيهه"],["notification","إشعار"],["willpower","قوة الإرادة"],["residue","بقايا / أثر متبقٍ"],["unglamorous","غير مبهر"]],
 q:[
  {t:"mcq",q:"What is the writer's main argument about attention?",o:["Technology has permanently destroyed concentration.","Attention has been redirected rather than lost.","Multitasking is an efficient modern skill.","Students today are lazier than before."],a:1,e:"الفقرة الأولى: الانتباه لم يختفِ بل أُعيد توجيهه."},
  {t:"mcq",q:"Why does the writer mention teams of specialists?",o:["To praise technological progress","To show the distraction is engineered, not personal weakness","To explain how apps are coded","To criticise schools"],a:1,e:"يوضح أن البيئة مصممة لهزيمة الإرادة، فالمشكلة ليست ضعفًا شخصيًا."},
  {t:"mcq",q:"“Attention residue” refers to:",o:["the time wasted switching tasks","the mental processing that continues after leaving a task","the memory of an old lesson","the noise around a student"],a:1,e:"النص يعرّفه بأن العقل يواصل معالجة المهمة المتروكة."},
  {t:"mcq",q:"The final sentence “Willpower is finite; architecture is not” means:",o:["Buildings matter more than people.","Designing your environment beats relying on self-control.","Discipline is useless in every situation.","Students should study for longer hours."],a:1,e:"الخلاصة: تنظيم البيئة أفعل من الاعتماد على الإرادة."},

function uniq4(correct, cands, pool){
  const out=[correct];
  cands.concat(shuffle(pool)).forEach(x=>{ if(out.length<4 && x && out.indexOf(x)<0) out.push(x); });
  return shuffle(out);
}

{id:"R6",lvl:"B1",t:"The Date Palm",ta:"النخلة",mins:2,
 text:["For thousands of years, the date palm has been one of the most important trees in Arabia. It grows well in hot, dry places, and it can live for more than one hundred years. Every part of the tree has a use: people eat the fruit, build roofs with the trunk, and make baskets and mats from the leaves.",
 "Dates are also very healthy. They contain natural sugar, which gives the body quick energy, as well as fibre and minerals such as potassium. This is why many people break their fast with dates during Ramadan.",
 "Today, Saudi Arabia is one of the largest producers of dates in the world. Farmers in regions like Al-Qassim and Al-Ahsa grow hundreds of different types, and the Buraidah date festival attracts buyers from many countries every year."],
 gloss:[["trunk","جذع"],["contain","يحتوي"],["fibre","ألياف"],["producers","منتجون"]],

    Q("How long can a date palm live?",["About ten years","More than one hundred years","Exactly fifty years","Only one season"],1,"ذُكر: more than one hundred years."),
    Q("What do people make from the leaves?",["Roofs","Baskets and mats","Medicine","Sugar"],1,"السلال والحصر من السعف."),
    Q("Why do dates give quick energy?",["They contain natural sugar","They are cooked","They are cold","They contain water only"],0,"السكر الطبيعي يعطي طاقة سريعة."),
    Q("The word “contain” in paragraph 2 is closest in meaning to:",["lose","have inside","produce","sell"],1,"contain = يحتوي."),
    Q("In paragraph 1, “it” in “it can live” refers to:",["Arabia","the date palm","the fruit","the roof"],1,"الضمير يعود على النخلة."),
    Q("Where is a famous date festival held?",["Al-Ahsa","Jeddah","Buraidah","Abha"],2,"مهرجان تمور بريدة."),
    Q("We can infer that dates are:",["only eaten in Saudi Arabia","valuable for both health and trade","difficult to grow","a new crop in Arabia"],1,"النص يذكر فوائدها الصحية وتجارتها العالمية.")]},

{id:"R8",lvl:"B1",t:"The Red Sea Reefs",ta:"شعاب البحر الأحمر",mins:3,
 text:["The Red Sea is home to some of the most colourful coral reefs on Earth. Although corals look like rocks or plants, they are actually animals. Millions of tiny creatures live together and slowly build large structures that can take thousands of years to grow.",
 "Coral reefs are important for many reasons. They provide food and shelter for more than a thousand species of fish, protect the coast from strong waves, and attract divers from around the world. Scientists are especially interested in Red Sea corals because they seem to survive warmer water better than corals in other oceans.",
 "However, reefs everywhere face serious dangers, including pollution, careless fishing and damage from boat anchors. Visitors can help by never touching or standing on coral, using reef-safe sun cream and taking all their rubbish home."],
 gloss:[["creatures","كائنات"],["shelter","مأوى"],["species","أنواع"],["anchors","مراسٍ"]],

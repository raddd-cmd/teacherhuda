<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Huda — منصة الإنجليزي للمرحلة المتوسطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ================= نظام التصميم ================= */
:root{
  --ink-900:#0D1526; --ink-800:#14203A; --ink-700:#1F2F52; --ink-500:#4A5C86; --ink-300:#8E9CBC;
  --paper:#F1F4FA; --paper-2:#E6EBF5; --card:#FFFFFF; --line:#DDE4F0;
  --mark:#FFD54A; --mark-deep:#D9A400; --mark-soft:#FFF3CE;
  --sky:#2E74D2; --sea:#0E9C97; --grape:#6B4BE0; --rose:#D6336C; --ember:#E8590C;
  --ok:#0C9A6C; --ok-soft:#E1F6EE; --no:#DC2743; --no-soft:#FDE8EC;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(13,21,38,.06), 0 2px 8px rgba(13,21,38,.05);
  --sh-2:0 4px 10px rgba(13,21,38,.07), 0 14px 32px rgba(13,21,38,.08);
  --sh-mark:0 6px 18px rgba(217,164,0,.28);
  --nav-h:0px;
}
[data-theme="dark"]{
  --paper:#080D18; --paper-2:#0E1626; --card:#121C30; --line:#243352;
  --ink-900:#EEF2FB; --ink-800:#DCE4F3; --ink-700:#C3CEE5; --ink-500:#93A2C2; --ink-300:#6C7C9E;
  --mark-soft:#3A3012; --ok-soft:#0C2A20; --no-soft:#33121B;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 10px 30px rgba(0,0,0,.5);
  --sh-mark:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(1100px 520px at 100% -8%, var(--glow1), transparent 60%),
    radial-gradient(900px 480px at -10% 0%, var(--glow2), transparent 55%),
    var(--paper);
  color:var(--ink-900);
  font-family:"Rubik","Segoe UI",Tahoma,sans-serif;
  font-size:16px; line-height:1.75; letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;
  padding-bottom:var(--nav-h);
}
.en{font-family:"Lora",Georgia,serif;direction:ltr;unicode-bidi:isolate}
.num{font-family:"Space Grotesk",monospace;font-weight:700;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3{letter-spacing:-.03em;line-height:1.35;margin:0}


/* ================= لوحات الألوان ================= */
:root{--glow1:rgba(107,75,224,.10);--glow2:rgba(46,116,210,.10)}
html[data-palette="bakery"]{
  --ink-900:#7C1122; --ink-800:#8E1626; --ink-700:#A81E33; --ink-500:#A2666E; --ink-300:#CBA4A9;
  --paper:#FAEEDD; --paper-2:#F8E0E3; --card:#FFFFFF; --line:#F1D8DC;
  --mark:#F4B8C1; --mark-deep:#A81E33; --mark-soft:#FCEAEC;
  --glow1:rgba(168,30,51,.14); --glow2:rgba(240,200,150,.30);
  --sh-mark:0 6px 18px rgba(168,30,51,.22);
  --sh-1:0 1px 2px rgba(124,17,34,.06), 0 2px 10px rgba(124,17,34,.06);
  --sh-2:0 6px 14px rgba(124,17,34,.08), 0 16px 36px rgba(124,17,34,.10);
}
html[data-theme="dark"][data-palette="bakery"]{ --paper:#190A0D; --paper-2:#241014; --card:#2B1219; --line:#48222B; --mark-soft:#3B171E; --ink-900:#FBEFEF; --ink-800:#F2DDDF; --ink-700:#E3C3C7; --ink-500:#BC9298; --ink-300:#8E6A70; }
html[data-palette="plum"]{
  --ink-900:#2A1028; --ink-800:#3A1838; --ink-700:#55214C; --ink-500:#7E5476; --ink-300:#B392AC;
  --paper:#FBF2F7; --paper-2:#F2E2EC; --card:#FFFFFF; --line:#EBD7E4;
  --mark:#F7A8C4; --mark-deep:#B03A6E; --mark-soft:#FCE6EF;
  --glow1:rgba(176,58,110,.13); --glow2:rgba(247,168,196,.16);
  --sh-mark:0 6px 18px rgba(176,58,110,.25);
}
html[data-theme="dark"][data-palette="plum"]{ --paper:#12060F; --paper-2:#1C0A18; --card:#25102052; --card:#241021; --line:#3E1C38; --mark-soft:#3A1029; }
html[data-palette="emerald"]{
  --ink-900:#072720; --ink-800:#0C3A2F; --ink-700:#125243; --ink-500:#48776A; --ink-300:#8FB0A5;
  --paper:#F0F7F3; --paper-2:#E0EFE7; --card:#FFFFFF; --line:#D5E8DF;
  --mark:#F3C64E; --mark-deep:#9C7400; --mark-soft:#FBF0D2;
  --glow1:rgba(18,82,67,.12); --glow2:rgba(243,198,78,.16);
  --sh-mark:0 6px 18px rgba(156,116,0,.25);
}
html[data-theme="dark"][data-palette="emerald"]{ --paper:#05140F; --paper-2:#0A1F19; --card:#0E2A22; --line:#1E4438; --mark-soft:#33290B; }
html[data-palette="violet"]{
  --ink-900:#1B1038; --ink-800:#261650; --ink-700:#392270; --ink-500:#6A5C9B; --ink-300:#A79ECB;
  --paper:#F5F3FD; --paper-2:#E9E4F9; --card:#FFFFFF; --line:#E0DAF4;
  --mark:#FFB088; --mark-deep:#C2552B; --mark-soft:#FFE9DD;
  --glow1:rgba(57,34,112,.14); --glow2:rgba(255,176,136,.18);
  --sh-mark:0 6px 18px rgba(194,85,43,.24);
}
html[data-theme="dark"][data-palette="violet"]{ --paper:#0A0619; --paper-2:#120B28; --card:#181035; --line:#2C1F55; --mark-soft:#3A2115; }
html[data-palette="ocean"]{
  --ink-900:#062430; --ink-800:#0A3442; --ink-700:#0F4B5E; --ink-500:#437687; --ink-300:#8FB3BF;
  --paper:#EFF6F9; --paper-2:#DDECF2; --card:#FFFFFF; --line:#D2E6EE;
  --mark:#FF9A76; --mark-deep:#C2492A; --mark-soft:#FFE6DC;
  --glow1:rgba(15,75,94,.13); --glow2:rgba(255,154,118,.16);
  --sh-mark:0 6px 18px rgba(194,73,42,.24);
}
html[data-theme="dark"][data-palette="ocean"]{ --paper:#04151C; --paper-2:#08222C; --card:#0B2C39; --line:#164457; --mark-soft:#3A1E15; }
/* لمسة تصميم الثيم القرمزي: لوح داخلي وردي فوق خلفية كريمية */
html[data-palette="bakery"] main{background:var(--paper-2);border-radius:26px;padding:22px 18px 60px;margin-top:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
html[data-palette="bakery"] .nav-in{background:var(--card)}
html[data-palette="bakery"] .appbar{border-bottom-color:var(--line)}
@media (max-width:520px){ html[data-palette="bakery"] main{border-radius:20px;padding:16px 12px 40px} }


/* ================= هيكل الصفحة الرئيسية ================= */
.searchwrap{position:relative;flex:1;max-width:300px;min-width:130px}
.topsearch{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);
  padding:8px 34px 8px 16px;color:var(--ink-900);font-size:.86rem}
.topsearch:focus{outline:none;border-color:var(--ink-700)}
.searchwrap .ic{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-size:.82rem;opacity:.55;pointer-events:none}
.searchres{position:absolute;top:44px;inset-inline-start:0;inset-inline-end:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--sh-2);max-height:330px;overflow:auto;z-index:80;display:none;padding:6px}
.searchres.open{display:block}
.sres{display:block;width:100%;text-align:right;background:none;border:0;padding:9px 12px;border-radius:10px;font-size:.86rem}
.sres:hover{background:var(--paper-2)}
.sres b{display:block;font-family:"Lora",serif;direction:ltr;text-align:right}
.sres span{font-size:.75rem;color:var(--ink-500)}
@media (max-width:700px){ .searchwrap{order:9;max-width:100%;flex-basis:100%} }

.banner{position:relative;overflow:hidden;border-radius:var(--r-l);padding:26px;margin-bottom:20px;color:#fff;
  background:linear-gradient(120deg,var(--ink-900) 15%,var(--ink-700) 75%);
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;box-shadow:var(--sh-2)}
.banner::before{content:"";position:absolute;inset:0;opacity:.3;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:20px 20px}
.bmain{flex:1;min-width:230px;position:relative}
.bmain h1{font-size:1.85rem;line-height:1.3;margin-bottom:8px;letter-spacing:-.04em}
.bmain h1 em{font-family:"Lora",Georgia,serif;font-style:italic;color:var(--mark);display:block;font-size:1.45rem}
.bmain p{margin:0;color:rgba(255,255,255,.78);font-size:.92rem;max-width:44ch}
.offer{display:inline-flex;align-items:center;gap:8px;background:var(--mark);color:#2B0A12;border-radius:var(--r-pill);
  padding:7px 18px;font-weight:700;font-size:.88rem;margin-top:14px;box-shadow:var(--sh-mark)}
.bcircle{width:148px;height:148px;border-radius:50%;background:var(--card);border:6px solid rgba(255,255,255,.85);
  display:grid;place-items:center;flex:none;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.bmini{display:flex;flex-direction:column;gap:12px;position:relative}
.bmini div{width:72px;height:72px;border-radius:50%;background:var(--card);border:4px solid rgba(255,255,255,.85);
  display:grid;place-items:center;font-size:1.45rem;box-shadow:0 8px 20px rgba(0,0,0,.2)}
@media (max-width:640px){ .bcircle{width:112px;height:112px} .bmini{flex-direction:row} .bmini div{width:58px;height:58px;font-size:1.2rem} .bmain h1{font-size:1.45rem} .bmain h1 em{font-size:1.12rem} }

.sechead{display:flex;align-items:flex-end;gap:12px;margin:28px 0 14px;flex-wrap:wrap}
.sechead h2{font-size:1.42rem;letter-spacing:-.03em}
.sechead .ar{font-size:.85rem;color:var(--ink-500);margin-inline-end:auto}
.sechead .more{background:var(--ink-900);color:var(--paper);border:0;border-radius:var(--r-pill);padding:7px 18px;font-size:.8rem;font-weight:600}
[data-theme="dark"] .sechead .more{background:var(--mark);color:#2B1219}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:var(--sh-1);transition:transform .18s,box-shadow .18s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--ink-500)}
.cat .ic{width:52px;height:52px;border-radius:16px;background:var(--mark-soft);display:grid;place-items:center;font-size:1.4rem;margin:0 auto 8px}
.cat .nm{font-family:"Lora",serif;direction:ltr;font-size:.9rem;font-weight:600}
.cat .sub{font-size:.73rem;color:var(--ink-500)}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:18px 12px;box-shadow:var(--sh-1);margin-bottom:14px}
.feat{text-align:center}
.feat .circ{width:56px;height:56px;border-radius:50%;border:2px solid var(--mark);display:grid;place-items:center;
  margin:0 auto 7px;font-family:"Space Grotesk";font-weight:700;font-size:.9rem;color:var(--ink-900)}
.feat .lb{font-size:.7rem;color:var(--ink-500);line-height:1.5}
.ticket{background:var(--mark-soft);border:1.5px dashed var(--mark-deep);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ticket .tic{font-size:1.9rem}
.ticket .tx{flex:1;min-width:150px}
.ticket .tx b{display:block;font-size:1.02rem;margin-bottom:2px}
.ticket .tx span{font-size:.8rem;color:var(--ink-500)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){ .two{grid-template-columns:1fr} .feats{grid-template-columns:repeat(2,1fr);gap:14px} }
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border-radius:18px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:right;background:linear-gradient(140deg,var(--ink-900),var(--ink-700));color:#fff;border:0;box-shadow:var(--sh-1);transition:transform .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.tile .ic{font-size:1.45rem}
.tile .nm{font-family:"Lora",serif;direction:ltr;text-align:right;font-weight:600;font-size:.95rem}
.tile .sb{font-size:.75rem;opacity:.82}
.tile.light{background:var(--card);color:var(--ink-900);border:1px solid var(--line)}
.tile.light .sb{color:var(--ink-500);opacity:1}
.ctabar{background:linear-gradient(135deg,var(--ink-900),var(--ink-700));color:#fff;border-radius:20px;padding:20px 24px;
  text-align:center;font-weight:600;font-size:1rem;margin:26px 0 10px;box-shadow:var(--sh-2)}
.ctabar span{display:block;font-size:.8rem;opacity:.8;font-weight:400;margin-top:4px}
footer.site{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
footer.site .fin{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;box-shadow:var(--sh-1)}
footer.site .brandf{font-weight:700;font-size:1.2rem;margin-bottom:14px}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:18px}
.fcol h4{font-size:.75rem;letter-spacing:.06em;color:var(--ink-500);margin-bottom:8px}
.fcol button{display:block;background:none;border:0;padding:3px 0;font-size:.85rem;color:var(--ink-800);text-align:right}
.fcol button:hover{color:var(--mark-deep)}
.fnote{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.77rem;color:var(--ink-500);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}


svg.i{width:1.08em;height:1.08em;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none;display:inline-block}
.navbtn .ic svg.i,.cat .ic svg.i,.tile .ic svg.i,.big-ic svg.i{width:1em;height:1em;stroke-width:1.6}
.bmini svg.i{width:1.5rem;height:1.5rem}
.bdg .ic svg.i{width:1.15rem;height:1.15rem}
.spk svg.i,.iconbtn svg.i{width:1.05rem;height:1.05rem}
.ticket .tic svg.i{width:1.9rem;height:1.9rem;stroke-width:1.4}
.btn svg.i,.pctl svg.i,.pbig svg.i,.fbtn svg.i{margin-inline-end:5px}

/* منتقي الثيم */
.palbox{position:absolute;top:56px;inset-inline-start:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-m);padding:10px;box-shadow:var(--sh-2);z-index:75;display:none;min-width:212px}
.palbox.open{display:block}
.palbox .hd{font-size:.76rem;color:var(--ink-500);padding:2px 8px 8px}
.pal{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1.5px solid transparent;
  background:none;width:100%;text-align:right;font-size:.88rem}
.pal:hover{background:var(--paper)}
.pal[aria-pressed="true"]{border-color:var(--ink-900);background:var(--paper)}
.dots{display:flex;gap:3px}
.dots i{width:15px;height:15px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}

/* ================= الشريط العلوي ================= */
.appbar{
  position:sticky;top:0;z-index:60;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.appbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;position:relative}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.02rem;white-space:nowrap}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--ink-900);color:var(--mark);display:grid;place-items:center;font-family:"Space Grotesk";font-size:.95rem;box-shadow:var(--sh-1)}
[data-theme="dark"] .brand .dot{background:var(--mark);color:var(--ink-900)}
.spacer{margin-inline-start:auto}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 12px;font-size:.82rem;box-shadow:var(--sh-1);white-space:nowrap}
.chip b{font-family:"Space Grotesk";font-size:.95rem}
.chip.xp b{color:var(--mark-deep)}
.chip.fire b{color:#E8590C}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-size:1rem;box-shadow:var(--sh-1)}
.iconbtn:hover{border-color:var(--ink-500)}
.iconbtn[aria-pressed="false"]{opacity:.45}

/* ================= التنقل ================= */
.nav{position:sticky;top:57px;z-index:55;background:transparent;padding:12px 16px 4px}
.nav-in{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px;box-shadow:var(--sh-1)}
.nav-in::-webkit-scrollbar{display:none}
.navbtn{flex:1;background:none;border:0;border-radius:var(--r-pill);padding:8px 14px;font-size:.9rem;font-weight:500;color:var(--ink-500);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.navbtn:hover{color:var(--ink-900)}
.navbtn[aria-selected="true"]{background:var(--ink-900);color:var(--paper);box-shadow:var(--sh-1)}
[data-theme="dark"] .navbtn[aria-selected="true"]{background:var(--mark);color:#2B1219}
.navbtn .ic{font-size:1rem;line-height:1}
@media (max-width:720px){
  :root{--nav-h:78px}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;padding:8px 10px 12px;
    background:linear-gradient(transparent, var(--paper) 35%)}
  .nav-in{box-shadow:var(--sh-2)}
  .navbtn{flex:0 0 auto;min-width:62px;flex-direction:column;gap:2px;font-size:.66rem;padding:6px 6px}
  .navbtn .ic{font-size:1.15rem}
}

main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none}
.eyebrow{font-size:.82rem;color:var(--ink-500);margin:0 0 6px}
h2.title{font-size:1.5rem;margin:0 0 6px}
.sub{color:var(--ink-500);font-size:.92rem;margin:0 0 18px;max-width:64ch}

/* ================= بطاقة البطل ================= */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-l);padding:26px 24px;margin-bottom:22px;
  background:linear-gradient(140deg, var(--ink-900), var(--ink-700) 70%, #2A3D6B);
  color:#fff;box-shadow:var(--sh-2);
}
.hero::before{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);background-size:18px 18px;pointer-events:none}
.hero::after{content:"";position:absolute;inset:auto -60px -120px auto;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--mark) 45%, transparent), transparent 62%)}
.hero-grid{position:relative;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:1.75rem;margin-bottom:8px;max-width:22ch}
.hero p{margin:0;color:#B9C6E2;font-size:.94rem;max-width:52ch}
.hero .lvl-name{color:var(--mark);font-weight:600}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:"Space Grotesk";font-size:1.5rem;display:block;line-height:1}
.ring .mid span{font-size:.68rem;color:#B9C6E2}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative}

/* ================= أزرار ================= */
.btn{background:var(--ink-900);color:var(--paper);border:0;border-radius:var(--r-pill);padding:10px 22px;font-weight:600;font-size:.94rem;box-shadow:var(--sh-1);display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.mark{background:linear-gradient(135deg, var(--mark), color-mix(in srgb, var(--mark) 72%, var(--mark-deep)));color:#1A1300;box-shadow:var(--sh-mark)}
.btn.ghost{background:transparent;color:var(--ink-900);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink-500);filter:none}
.btn.sm{padding:6px 14px;font-size:.84rem}
[data-theme="dark"] .btn{background:var(--card);border:1px solid var(--line);color:var(--ink-900)}
[data-theme="dark"] .btn.mark{background:var(--mark);color:#1A1300;border:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.mt{margin-top:16px}

/* ================= خريطة الرحلة ================= */
.levelbar{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.levelbar .tag{font-family:"Space Grotesk";font-weight:700;font-size:.9rem;color:#fff;padding:3px 12px;border-radius:var(--r-pill)}
.levelbar .ln{flex:1;height:1px;background:var(--line)}
.levelbar .pc{font-size:.8rem;color:var(--ink-500)}
.tag.A1{background:var(--sky)} .tag.A2{background:var(--sea)} .tag.B1{background:var(--grape)} .tag.B2{background:var(--rose)} .tag.C1{background:var(--ember)}
.journey{list-style:none;margin:0;padding:0 0 4px;position:relative}
.journey::before{content:"";position:absolute;top:14px;bottom:14px;right:23px;width:2px;
  background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 12px)}
.station{position:relative;padding:0 62px 12px 0}
.station button{width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 16px;box-shadow:var(--sh-1);display:flex;align-items:center;gap:12px}
.station button:hover{border-color:var(--ink-500);box-shadow:var(--sh-2)}
.station .node{position:absolute;right:6px;top:12px;width:36px;height:36px;border-radius:50%;
  background:var(--card);border:2px solid var(--line);display:grid;place-items:center;
  font-family:"Space Grotesk";font-weight:700;font-size:.85rem;color:var(--ink-500);z-index:2}
.station.on .node{background:var(--mark);border-color:var(--mark);color:#1A1300;box-shadow:var(--sh-mark)}
.station.full .node{background:var(--ok);border-color:var(--ok);color:#fff}
.station .st-t{font-weight:600;font-size:.98rem}
.station .st-e{font-family:"Lora",serif;direction:ltr;text-align:right;color:var(--ink-500);font-size:.84rem}
.station .st-m{margin-inline-start:auto;text-align:center;font-size:.7rem;color:var(--ink-500);flex:none}
.mini{width:52px;height:5px;border-radius:9px;background:var(--paper-2);overflow:hidden;margin-bottom:4px}
.mini i{display:block;height:100%;background:var(--ok)}

/* ================= بطاقات عامة ================= */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;box-shadow:var(--sh-1)}
button.card{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
button.card{transition:transform .18s, box-shadow .18s, border-color .18s}
button.card:hover{border-color:var(--ink-500);box-shadow:var(--sh-2);transform:translateY(-2px)}
.card .t{font-weight:600;font-size:1.02rem}
.card .t-en{font-family:"Lora",serif;direction:ltr;color:var(--ink-500);font-size:.86rem}
.card .m{font-size:.82rem;color:var(--ink-500)}
.card .big-ic{font-size:1.5rem;line-height:1}
.badge{display:inline-block;font-size:.7rem;font-weight:600;color:#fff;border-radius:6px;padding:2px 9px}
.A1{background:var(--sky)} .A2{background:var(--sea)} .B1{background:var(--grape)} .B2{background:var(--rose)} .C1{background:var(--ember)} .V{background:var(--mark-deep)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fbtn{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:6px 16px;font-size:.86rem;color:var(--ink-500)}
.fbtn[aria-pressed="true"]{background:var(--ink-900);color:var(--paper);border-color:var(--ink-900)}
[data-theme="dark"] .fbtn[aria-pressed="true"]{background:var(--mark);color:#1A1300;border-color:var(--mark)}
.search{width:100%;max-width:420px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);
  padding:9px 18px;margin-bottom:16px;color:var(--ink-900)}
.search::placeholder{color:var(--ink-300)}

/* ================= صفحة الدرس ================= */
.back{background:none;border:0;color:var(--ink-500);padding:6px 0;font-size:.9rem;margin-bottom:10px}
.back:hover{color:var(--ink-900)}
.lesson-head{background:linear-gradient(140deg,var(--ink-900),var(--ink-700));color:#fff;border-radius:var(--r-l) var(--r-l) 0 0;padding:22px 24px}
.lesson-head h2{font-size:1.42rem;margin:8px 0 2px}
.lesson-head h2.en-h{font-family:"Lora",Georgia,serif;direction:ltr;text-align:right;font-size:1.5rem}
.sub-ar{color:var(--mark);font-size:.95rem;margin:2px 0 0}
.en-t{font-family:"Lora",Georgia,serif;direction:ltr;text-align:right;font-size:1.02rem}
.t-ar{font-size:.85rem;color:var(--ink-500)}
.ar-sub{font-family:"Rubik",sans-serif;direction:rtl;text-align:right;font-size:.82rem;color:var(--ink-500)}
.lesson-head .sub-en{font-family:"Lora",serif;direction:ltr;text-align:right;color:var(--mark);font-size:1rem;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-l) var(--r-l);padding:22px 24px;margin-bottom:26px;box-shadow:var(--sh-1)}
.panel h3{font-size:1.04rem;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.panel h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--mark);flex:none}
.panel h3:first-child{margin-top:0}
.panel p{margin:0 0 14px;color:var(--ink-800)}
ul.pts{margin:0 0 14px;padding-inline-start:20px}
ul.pts li{margin-bottom:9px}
ul.pts li::marker{color:var(--mark-deep)}
.hl{background:linear-gradient(transparent 56%, var(--mark) 56%);padding:0 3px;font-weight:500;border-radius:2px}
[data-theme="dark"] .hl{background:linear-gradient(transparent 56%, rgba(255,213,74,.42) 56%);color:#fff}
table.form{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 16px;font-size:.92rem;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
table.form th{background:var(--paper-2);text-align:right;padding:10px 13px;font-weight:600;font-size:.86rem;color:var(--ink-700)}
table.form td{padding:10px 13px;border-top:1px solid var(--line);vertical-align:top}
table.form td.e{font-family:"Lora",serif;direction:ltr;text-align:left}
.ex-line{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border-radius:var(--r-s);padding:10px 14px;margin-bottom:10px}
.ex-line .body{flex:1}
.ex-line .s{font-family:"Lora",serif;direction:ltr;text-align:left;font-size:1.04rem}
.ex-line .m{color:var(--ink-500);font-size:.87rem}
.spk{background:var(--card);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;flex:none;display:grid;place-items:center;font-size:.85rem}
.spk:hover{border-color:var(--mark-deep);background:var(--mark-soft)}
.spk.playing{background:var(--mark);border-color:var(--mark)}
.mis{background:var(--mark-soft);border:1px solid var(--mark);border-color:color-mix(in srgb,var(--mark) 45%, transparent);border-radius:var(--r-s);padding:12px 15px;margin-bottom:10px}
.mis .bad,.mis .good{font-family:"Lora",serif;direction:ltr;text-align:left}
.mis .bad{color:var(--no)} .mis .good{color:var(--ok);font-weight:600}
.mis .note{color:var(--ink-500);font-size:.86rem;margin-top:4px}

/* ================= الأسئلة ================= */
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;margin-bottom:14px;box-shadow:var(--sh-1);position:relative}
.qbox.correct{border-color:var(--ok);background:var(--ok-soft)}
.qbox.wrong{border-color:var(--no);background:var(--no-soft)}
.qbox.shake{animation:shake .4s}
.qbox.pop{animation:pop .34s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}100%{transform:none}}
@keyframes pop{40%{transform:scale(1.014)}100%{transform:none}}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.76rem;color:var(--ink-500)}
.qhead .k{background:var(--paper-2);border-radius:var(--r-pill);padding:2px 10px}
.qtext{font-family:"Lora",serif;direction:ltr;text-align:left;font-size:1.08rem;margin-bottom:15px;line-height:1.95}
.qtext.ar{font-family:"Rubik",sans-serif;direction:rtl;text-align:right}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 15px;text-align:left;font-family:"Lora",serif;direction:ltr;font-size:1rem;display:flex;align-items:center;gap:10px}
.opt::before{content:attr(data-k);font-family:"Space Grotesk";font-size:.72rem;color:var(--ink-300);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt:hover:not(:disabled){border-color:var(--ink-500)}
.opt.sel{border-color:var(--ink-900);background:var(--card)}
.opt.sel::before{background:var(--ink-900);color:var(--paper);border-color:var(--ink-900)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrongpick{border-color:var(--no);color:var(--no);text-decoration:line-through}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
.opt.ar-opt{font-family:"Rubik",sans-serif;direction:rtl;text-align:right}
input.gap{font-family:"Lora",serif;font-size:1rem;border:0;border-bottom:2.5px solid var(--ink-500);background:transparent;padding:2px 8px;min-width:130px;direction:ltr;color:var(--ink-900)}
input.gap:focus{border-color:var(--mark-deep);outline:none;background:var(--mark-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin-bottom:12px}
.chip-w{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 13px;font-family:"Lora",serif}
.chip-w:hover{border-color:var(--ink-500)}
.chip-w.used{opacity:.22;pointer-events:none}
.build{min-height:48px;border:1.5px dashed var(--line);border-radius:12px;background:var(--paper);direction:ltr;text-align:left;
  font-family:"Lora",serif;font-size:1.05rem;padding:9px 12px;margin-bottom:10px}
.fb{margin-top:14px;font-size:.92rem;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.fb b{display:block;margin-bottom:3px;font-size:.98rem}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--no)}
.xpfly{position:absolute;top:12px;left:14px;font-family:"Space Grotesk";font-weight:700;color:var(--mark-deep);pointer-events:none;animation:fly 1.1s forwards}
@keyframes fly{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}

/* ================= بطاقات المفردات ================= */
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.flip{background:none;border:0;padding:0;perspective:900px;height:142px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.turned .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px;text-align:center}
.flip .back{transform:rotateY(180deg);background:var(--ink-900);color:#fff;border-color:var(--ink-900)}
.flip .w{font-family:"Lora",serif;font-size:1.12rem;font-weight:600}
.flip .pos{font-family:"Space Grotesk";font-size:.7rem;color:var(--ink-300)}
.flip .ar{font-size:1.08rem;color:var(--mark);font-weight:600}
.flip .sent{font-family:"Lora",serif;direction:ltr;font-size:.78rem;color:#B9C6E2;font-style:italic;line-height:1.5}
.flip .tap{font-size:.68rem;color:var(--ink-300)}

/* ================= Shadowing ================= */
.shcard{background:linear-gradient(140deg,var(--ink-900),var(--ink-700));color:#fff;border-radius:var(--r-l);padding:26px 22px;text-align:center;margin-bottom:16px;box-shadow:var(--sh-2)}
.shsent{font-family:"Lora",Georgia,serif;direction:ltr;font-size:1.45rem;line-height:1.6;margin-bottom:8px;transition:filter .25s}
.shsent.blur{filter:blur(9px);user-select:none}
.shar{color:#B9C6E2;font-size:.92rem;margin-bottom:14px}
.shcard .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.shstep{font-weight:600;font-size:.95rem;margin:4px 0 8px}
.pbig.mic.rec,.pctl.rec{background:var(--no);color:#fff;border-color:var(--no);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(220,39,67,.15)}}
.shres:empty{display:none}
.shscore{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.shscore b{font-size:1.8rem}
.shscore b.hi{color:var(--ok)} .shscore b.mid{color:var(--mark-deep)} .shscore b.low{color:var(--no)}
.shwords{direction:ltr;text-align:center;font-family:"Lora",serif;font-size:1.15rem;line-height:2.2;margin-bottom:6px}
.shwords .w{padding:2px 6px;border-radius:6px;margin:0 2px;cursor:pointer;display:inline-block}
.shwords .ok{background:var(--ok-soft);color:var(--ok)}
.shwords .miss{background:var(--no-soft);color:var(--no);text-decoration:underline wavy}

/* ================= الدخول والهوية ================= */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;overflow:auto;
  background:linear-gradient(150deg,#0D1526,#1F2F52 65%,#2A3D6B)}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:430px;background:var(--card);border-radius:var(--r-l);padding:30px 26px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.gate-brand{display:flex;align-items:center;gap:9px;font-weight:700;margin-bottom:18px}
.gate-brand .dot{width:34px;height:34px;border-radius:10px;background:var(--ink-900);color:var(--mark);display:grid;place-items:center;font-family:"Space Grotesk";font-size:.95rem}
.gate-card h2{font-size:1.4rem;margin-bottom:6px}
.gate-sub{color:var(--ink-500);font-size:.9rem;margin:0 0 18px}
.gate-in{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:10px;color:var(--ink-900)}
.gate-in:focus{outline:none;border-color:var(--ink-900)}
.gate-btn{width:100%;justify-content:center;margin-top:6px}
.gate-note{font-size:.78rem;color:var(--ink-300);margin:14px 0 0;text-align:center}
.who{max-width:150px}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px;display:inline-block;vertical-align:bottom}
.profrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;width:100%;text-align:right}
.profrow:hover{border-color:var(--ink-900)}
.profrow .nm{font-weight:600;flex:1}
.profrow .xp{font-family:"Space Grotesk";font-size:.85rem;color:var(--mark-deep)}
.profrow .del{background:none;border:0;color:var(--ink-300);font-size:.9rem;padding:2px 6px}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-300);font-size:.8rem;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.report{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:.88rem;white-space:pre-wrap;line-height:1.9;max-height:300px;overflow:auto;margin-bottom:12px}
.tarea{width:100%;min-height:150px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink-900);font-family:inherit;font-size:.86rem;margin-bottom:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.tbl th{background:var(--paper-2);padding:9px 10px;text-align:right;font-size:.8rem}
.tbl td{padding:9px 10px;border-top:1px solid var(--line)}
.tbl td.num{font-family:"Space Grotesk"}

/* ================= ستيب ================= */
.player{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:11px;margin-bottom:12px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbig{background:var(--ink-900);color:var(--mark);border:0;border-radius:var(--r-pill);padding:11px 26px;font-size:1rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sh-2)}
[data-theme="dark"] .pbig{background:var(--mark);color:#1A1300}
.pbig:disabled{opacity:.45}
.pctl{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:9px 18px;font-size:.88rem;font-weight:500}
.pctl:disabled{opacity:.4}
.pstat{font-size:.8rem;color:var(--ink-500);text-align:center}
.pstat b{font-family:"Space Grotesk";color:var(--ink-900)}
.speeds{display:flex;gap:6px;justify-content:center;align-items:center;font-size:.78rem;color:var(--ink-500)}
.spd{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:4px 13px;font-size:.8rem}
.spd[aria-pressed="true"]{background:var(--ink-900);color:var(--paper);border-color:var(--ink-900)}
[data-theme="dark"] .spd[aria-pressed="true"]{background:var(--mark);color:#1A1300;border-color:var(--mark)}
.audio-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;margin-bottom:14px;text-align:center;box-shadow:var(--sh-1)}
.audio-card .kind{font-size:.76rem;color:var(--ink-500);margin-bottom:10px}
.script{background:var(--paper);border-radius:var(--r-s);padding:12px 14px;margin-top:10px;font-family:"Lora",serif;direction:ltr;text-align:left;font-size:.95rem;line-height:1.9}
.sec-tag{display:inline-block;background:var(--ink-900);color:var(--paper);border-radius:var(--r-pill);padding:3px 14px;font-size:.78rem;font-weight:600}
[data-theme="dark"] .sec-tag{background:var(--mark);color:#1A1300}
.band{font-family:"Space Grotesk";font-size:1.05rem;font-weight:700;padding:6px 18px;border-radius:var(--r-pill);display:inline-block;margin-bottom:10px}
.band.hi{background:var(--ok-soft);color:var(--ok)} .band.mid{background:var(--mark-soft);color:var(--mark-deep)} .band.low{background:var(--no-soft);color:var(--no)}
.wtable{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;margin-bottom:14px}
.wtable th{background:var(--paper-2);padding:9px 12px;text-align:right;font-size:.84rem}
.wtable td{padding:9px 12px;border-top:1px solid var(--line)}

/* ================= القراءة ================= */
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;box-shadow:var(--sh-1);margin-bottom:20px}
.pw{display:flex;gap:12px;align-items:flex-start;margin-bottom:15px}
.pw p{font-family:"Lora",Georgia,serif;direction:ltr;text-align:left;font-size:1.07rem;line-height:2.05;margin:0;flex:1}
.gloss{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.gloss span{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 13px;font-size:.84rem}
.gloss b{font-family:"Lora",serif;color:var(--ink-900);margin-inline-end:5px}
.rmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.8rem;color:var(--ink-500)}
.lvlbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lvlbar .nm{width:34px;font-family:"Space Grotesk";font-weight:700;font-size:.85rem}
.lvlbar .bar{flex:1}
.lvlbar .pc{width:42px;text-align:left;font-family:"Space Grotesk";font-size:.85rem}

/* ================= تحدي الدقيقة ================= */
.timer{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 18px;margin-bottom:16px;box-shadow:var(--sh-1)}
.timer .t{font-family:"Space Grotesk";font-size:2rem;line-height:1}
.timer.low .t{color:var(--no)}
.bar{flex:1;height:9px;border-radius:9px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mark),var(--mark-deep));transition:width .9s linear}
.streakline{font-size:.8rem;color:var(--ink-500)}

/* ================= النتيجة والشارات ================= */
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:30px 24px;text-align:center;box-shadow:var(--sh-2)}
.result .ring{margin:0 auto 8px}
.result .msg{color:var(--ink-500);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:12px;margin:0 0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;text-align:center;box-shadow:var(--sh-1)}
.stat .n{font-family:"Space Grotesk";font-size:1.75rem;line-height:1.2}
.stat .l{font-size:.78rem;color:var(--ink-500)}
.bdg{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;box-shadow:var(--sh-1)}
.bdg .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;background:var(--paper-2);flex:none}
.bdg.got .ic{background:var(--mark);box-shadow:var(--sh-mark)}
.bdg.locked{opacity:.5}
.bdg .n{font-weight:600;font-size:.92rem}
.bdg .d{font-size:.78rem;color:var(--ink-500)}
.note{font-size:.84rem;color:var(--ink-500);background:var(--card);border:1px dashed var(--line);border-radius:var(--r-m);padding:12px 16px;margin-top:18px}

/* ================= الزر العائم والتنبيهات ================= */
.fab{position:fixed;inset-inline-start:18px;bottom:calc(var(--nav-h) + 18px);z-index:58;
  background:var(--no);color:#fff;border:0;border-radius:var(--r-pill);padding:11px 18px;font-weight:600;font-size:.88rem;
  box-shadow:0 8px 24px rgba(220,39,67,.4);display:none;align-items:center;gap:8px}
.fab.show{display:flex}
.toasts{position:fixed;inset-inline-start:0;inset-inline-end:0;bottom:calc(var(--nav-h) + 16px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink-900);color:#fff;border-radius:var(--r-pill);padding:10px 20px;font-size:.88rem;box-shadow:var(--sh-2);animation:up .3s}
.toast.gold{background:var(--mark);color:#1A1300}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(8,13,24,.55);backdrop-filter:blur(3px);display:none;padding:20px;overflow:auto}
.sheet.open{display:block}
.sheet-in{max-width:820px;margin:24px auto;background:var(--card);border-radius:var(--r-l);padding:24px;box-shadow:var(--sh-2)}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head h2{flex:1}

/* ================= الطباعة ================= */
@media print{
  .appbar,.nav,.fab,.toasts,.sheet-head .btn,.no-print{display:none!important}
  body{background:#fff;padding:0}
  .sheet{position:static;background:#fff;padding:0;display:block}
  .sheet-in{box-shadow:none;margin:0;max-width:100%;border-radius:0}
  .ws-q{break-inside:avoid;page-break-inside:avoid}
}
.ws-q{border-bottom:1px dashed var(--line);padding:10px 0}
.ws-q .qn{font-family:"Space Grotesk";color:var(--ink-500);font-size:.8rem}
.ws-q .qt{font-family:"Lora",serif;direction:ltr;text-align:left;font-size:1rem}
.ws-q .qo{font-family:"Lora",serif;direction:ltr;text-align:left;color:var(--ink-500);font-size:.9rem}
.ws-key{font-family:"Space Grotesk";font-size:.85rem;color:var(--ink-700);line-height:2;direction:ltr;text-align:left}

@media (max-width:430px){
  .brand span:not(.dot){display:none}
  .chip{padding:4px 9px;font-size:.76rem}
  .appbar-in{gap:7px;padding:9px 12px}
}
@media (max-width:520px){
  .hero{padding:22px 18px} .hero h1{font-size:1.42rem}
  .panel,.qbox{padding:16px} .lesson-head{padding:18px}
  main{padding:14px 12px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{id:"L1",lvl:"A1",t:"Verb to be",ta:"فعل الكون: am / is / are",
 intro:"فعل to be هو أساس الجمل في الإنجليزي. نستخدمه للتعريف بالنفس، ووصف الأشياء، وذكر المكان والعمر والمشاعر.",
 pts:["مع <span class='hl'>I</span> نستخدم am، ومع he / she / it نستخدم is، ومع we / you / they نستخدم are.",
      "النفي بإضافة not: <span class='en'>I am not · He is not (isn't) · They are not (aren't)</span>.",

 form:{head:["الضمير","الفعل","مثال"],rows:[["I","am","I am from Riyadh."],["He / She / It","is","She is my sister."],["We / You / They","are","They are in class."]]},

 q:[
  {t:"mcq",q:"My mother ___ a nurse.",o:["am","is","are","be"],a:1,e:"mother مفرد (she) ← is."},
  {t:"mcq",q:"___ you from Jeddah?",o:["Am","Is","Are","Do"],a:2,e:"مع you نستخدم are، ونقدّمها في السؤال."},
  {t:"mcq",q:"Ali and Omar ___ in the library.",o:["is","am","are","be"],a:2,e:"فاعل جمع (they) ← are."},
  {t:"gap",q:"I ___ ready for the test.",a:["am","'m"],e:"مع I نستخدم am."},
  {t:"gap",q:"The books ___ on the desk.",a:["are","'re"],e:"books جمع ← are."},
  {t:"gap",q:"She ___ not my teacher.",a:["is","'s"],e:"she ← is، والنفي is not / isn't."},
  {t:"ord",w:["is","This","new","my","bag"],a:"This is my new bag",e:"الترتيب: المبتدأ + is + الصفة/الملكية + الاسم."},
  {t:"ord",w:["Are","they","at","school","?"],a:"Are they at school ?",e:"في السؤال يأتي are قبل الفاعل."}
 ]},

{id:"L2",lvl:"A1",t:"Subject pronouns & possessives",ta:"ضمائر الفاعل وصفات الملكية",
 intro:"الضمائر تغنينا عن تكرار الأسماء، وصفات الملكية تبيّن لمن يعود الشيء.",
 pts:["ضمائر الفاعل تأتي قبل الفعل: <span class='en'>I, you, he, she, it, we, they</span>.",
      "صفة الملكية تأتي <span class='hl'>قبل الاسم مباشرة</span>: <span class='en'>my book, his car, their house</span>.",
      "انتبه للفرق بين <span class='en'>its</span> (ملكية) و <span class='en'>it's</span> (اختصار it is).",
      "لا نجمع بين صفة الملكية وأداة التعريف: نقول <span class='en'>my book</span> لا <span class='en'>the my book</span>."],
 form:{head:["ضمير الفاعل","صفة الملكية","مثال"],rows:[["I / you","my / your","This is my pen."],["he / she / it","his / her / its","Her name is Sara."],["we / they","our / their","Our school is big."]]},
 ex:[["He is my cousin. His name is Faisal.","هو ابن عمي. اسمه فيصل."],["The cat is drinking its milk.","القطة تشرب حليبها."],["We love our city.","نحب مدينتنا."],["Their answers are correct.","إجاباتهم صحيحة."]],
 mis:[["She name is Nora.","Her name is Nora.","قبل الاسم نستخدم صفة الملكية her لا ضمير الفاعل she."],["This is me book.","This is my book.","me ضمير مفعول، وصفة الملكية هي my."]],
 q:[
  {t:"mcq",q:"Sara is my sister. ___ is twelve.",o:["Her","She","Hers","He"],a:1,e:"نحتاج ضمير فاعل قبل الفعل ← She."},
  {t:"mcq",q:"That is Khalid and this is ___ bike.",o:["he","him","his","her"],a:2,e:"ملكية لمذكر ← his."},
  {t:"mcq",q:"We clean ___ classroom every day.",o:["us","our","ours","their"],a:1,e:"ملكية لـ we ← our."},
  {t:"gap",q:"The students opened ___ books. (they)",a:["their"],e:"ملكية they ← their."},
  {t:"gap",q:"I like ___ new phone. (I)",a:["my"],e:"ملكية I ← my."},
  {t:"gap",q:"Is this ___ pen? (you)",a:["your"],e:"ملكية you ← your."},
  {t:"ord",w:["is","name","My","Noura"],a:"My name is Noura",e:"صفة الملكية + الاسم + is + الخبر."},
  {t:"ord",w:["their","in","They","do","homework","the","evening"],a:"They do their homework in the evening",e:"الفاعل + الفعل + المفعول + ظرف الزمان."}
 ]},

{id:"L3",lvl:"A1",t:"There is / There are",ta:"يوجد: There is / There are",
 intro:"نستخدم هذا التركيب لنقول إن شيئًا ما موجود في مكان ما.",
 pts:["<span class='en'>There is</span> مع المفرد وغير المعدود، و<span class='en'>There are</span> مع الجمع.",
      "النفي: <span class='en'>There isn't a lift.</span> / <span class='en'>There aren't any chairs.</span>",

    Q("How long can reefs take to grow?",["A few weeks","Thousands of years","One year","Ten years"],1,"thousands of years."),
    Q("Which is NOT mentioned as a benefit of reefs?",["Shelter for fish","Protecting the coast","Producing oil","Attracting divers"],2,"النفط غير مذكور."),
    Q("Why are scientists interested in Red Sea corals?",["They are the oldest","They seem to survive warmer water better","They are easy to move","They grow very fast"],1,"تحمّل المياه الأدفأ."),
    Q("“Shelter” in paragraph 2 means:",["danger","a safe place","a meal","a colour"],1,"shelter = مأوى آمن."),
    Q("How can visitors help protect reefs?",["By standing on coral","By taking their rubbish home","By fishing more","By using anchors"],1,"taking all their rubbish home."),
    Q("The writer's purpose in the last paragraph is mainly to:",["entertain readers","give advice","describe a fish","compare oceans"],1,"الفقرة الأخيرة نصائح عملية.")]},

{id:"R9",lvl:"B1",t:"Sara's Saturdays",ta:"سبت سارة",mins:2,
 text:["Every Saturday morning, sixteen-year-old Sara spends three hours at a local food bank. The food bank collects food from supermarkets, restaurants and families, and gives it to people who cannot afford enough to eat.",
 "Sara's job is to check the dates on packets, sort them into boxes and prepare bags for families. “At first I thought it would be boring,” she says, “but I quickly realised how much each bag means to someone.” She has also learned to work in a team and to organise her time better.",
 "The food bank's manager says that young volunteers are extremely valuable. “They bring energy and new ideas,” he explains. “Last year, a group of students created a simple online system to track donations, and it saved us hours of work every week.”"],
 gloss:[["afford","يقدر على ثمن"],["sort","يفرز"],["realised","أدركت"],["donations","تبرعات"]],
 q:[Q("What is the passage mainly about?",["A teenager's volunteering at a food bank","How supermarkets sell food","A new online game","Sara's exams"],0,"تجربة تطوع مراهقة."),
    Q("How long does Sara volunteer each week?",["One hour","Two hours","Three hours","All day"],2,"three hours."),
    Q("Where does the food bank get food from?",["Only farms","Supermarkets, restaurants and families","The government only","Other countries"],1,"ذُكرت المصادر الثلاثة."),
    Q("What was Sara's first opinion of the work?",["Exciting","Boring","Dangerous","Easy"],1,"I thought it would be boring."),
    Q("Which skill has Sara developed?",["Cooking","Teamwork","Driving","Painting"],1,"learned to work in a team."),
    Q("“Afford” in paragraph 1 means:",["have enough money for","want","cook","carry"],0,"afford = يقدر على دفع الثمن."),
    Q("What did students create last year?",["A new building","An online system to track donations","A cookbook","A delivery van"],1,"online system to track donations."),
    Q("The manager's attitude towards young volunteers is:",["negative","grateful and positive","uninterested","worried"],1,"extremely valuable ← امتنان.")]},

{id:"R10",lvl:"B1",t:"Getting Ready for Exams",ta:"الاستعداد للاختبارات",mins:2,
 text:["Many students start revising only a few days before an exam and then feel stressed and tired. A better plan is to begin at least two weeks early and divide the material into small sections that you can review a little every day.",
 "When you study, avoid just reading your notes again and again. Instead, close the book and try to write down everything you remember, or explain the topic aloud as if you were teaching a friend. Practice tests are also useful because they show you which areas need more work.",
 "Finally, remember that your body affects your brain. Sleeping for eight hours, eating regular meals and taking short breaks every hour can improve concentration. On the day of the exam, arrive early, read every question carefully and leave time at the end to check your answers."],
 gloss:[["revising","المراجعة"],["divide","يقسّم"],["aloud","بصوت مرتفع"],["concentration","التركيز"]],
 q:[Q("What is the passage mainly about?",["Advice for effective exam preparation","The history of exams","Why exams are unfair","How teachers write tests"],0,"نصائح للاستعداد."),
    Q("When does the writer suggest starting revision?",["The night before","At least two weeks early","After the exam","One day early"],1,"at least two weeks early."),
    Q("What should students avoid?",["Taking breaks","Reading notes again and again","Sleeping well","Practice tests"],1,"avoid just reading your notes again and again."),
    Q("Why are practice tests useful?",["They are fun","They show which areas need more work","They replace studying","Teachers mark them"],1,"تكشف نقاط الضعف."),
    Q("How often should students take short breaks?",["Every hour","Every day","Every week","Never"],0,"every hour."),
    Q("“Concentration” is closest in meaning to:",["focus","sleep","noise","speed"],0,"concentration = focus."),
    Q("What should students do at the end of the exam?",["Leave early","Check their answers","Start a new question","Talk to friends"],1,"leave time to check your answers."),
    Q("“As if you were teaching a friend” suggests:",["explaining clearly in your own words","copying from a friend","studying only in groups","asking the teacher"],0,"الشرح بأسلوبك يثبت المعلومة.")]},

{id:"R11",lvl:"B1",t:"Ship of the Desert",ta:"سفينة الصحراء",mins:2,
 text:["The camel is often called the “ship of the desert”, and it is easy to see why. For centuries, camels carried people and goods across the Arabian Peninsula, where few other animals could survive the heat and lack of water.",
 "Camels have several special features. Their humps store fat, not water, which the body can use for energy when food is scarce. Long eyelashes and nostrils that can close protect them from sandstorms, and wide feet stop them from sinking into soft sand. A thirsty camel can drink more than 100 litres of water in just a few minutes.",
 "Although cars and trucks have replaced camels for transport, they remain an important part of Saudi culture. Camel races and beauty competitions attract large crowds, and camel milk is becoming popular as a healthy drink."],
 gloss:[["goods","بضائع"],["humps","أسنمة"],["scarce","نادر"],["sinking","الغوص / الانغراس"]],
 q:[Q("Why is the camel called the “ship of the desert”?",["It can swim","It carried people and goods across the desert","It looks like a boat","It lives near the sea"],1,"نقل الناس والبضائع عبر الصحراء."),
    Q("What do camels' humps store?",["Water","Fat","Milk","Air"],1,"store fat, not water."),
    Q("How do wide feet help camels?",["They help them run fast","They stop them sinking into sand","They keep them cool","They help them swim"],1,"stop them from sinking."),
    Q("What protects camels from sandstorms?",["Their humps","Long eyelashes and nostrils that close","Their tails","Their wide feet"],1,"الرموش الطويلة والأنف الذي يُغلق."),
    Q("“Scarce” in paragraph 2 means:",["plentiful","hard to find","delicious","expensive"],1,"scarce = شحيح."),
    Q("How much water can a thirsty camel drink?",["About 10 litres","More than 100 litres","Exactly 50 litres","1 litre"],1,"more than 100 litres."),
    Q("Which is mentioned as a modern use of camels?",["Transporting oil","Races and beauty competitions","Ploughing fields","Carrying mail"],1,"السباقات ومسابقات الجمال."),
    Q("The best title for the passage is:",["The Camel: Features and Importance","The History of Cars","Desert Weather","How to Ride a Camel"],0,"النص عن خصائص الجمل وأهميته.")]},

{id:"R12",lvl:"B2",t:"AlUla and the New Tourism",ta:"العُلا والسياحة الجديدة",mins:3,
 text:["For many years, most visitors to Saudi Arabia came for religious or business reasons. In recent years, however, the country has opened up to leisure tourism, and places that were once known mainly to locals are now attracting international travellers.",
 "One of the most remarkable is AlUla, in the north-west of the Kingdom. Its most famous site, Hegra, contains more than a hundred monumental tombs carved into sandstone by the Nabataeans around two thousand years ago. In 2008, Hegra became the first site in Saudi Arabia to be added to UNESCO's World Heritage List.",
 "Developing tourism brings clear benefits, such as new jobs and a more varied economy. Yet it also raises important questions. Experts stress that fragile desert landscapes and ancient monuments must be protected, and that growth should respect local communities rather than simply maximise visitor numbers."],
 gloss:[["leisure","الترفيه"],["remarkable","لافت"],["monumental","ضخم"],["fragile","هشّ"]],
 q:[Q("What is the passage mainly about?",["Saudi tourism growth, with AlUla as an example","How to build tombs","A guide to religious travel","The Nabataean language"],0,"السياحة الجديدة والعلا مثالًا."),
    Q("Why did most visitors come to Saudi Arabia in the past?",["For leisure","For religious or business reasons","For sports","For shopping"],1,"religious or business reasons."),
    Q("Who carved the tombs at Hegra?",["The Romans","The Nabataeans","Modern artists","The Ottomans"],1,"by the Nabataeans."),
    Q("What happened in 2008?",["AlUla was built","Hegra joined UNESCO's World Heritage List","Tourism was banned","The tombs were discovered"],1,"أول موقع سعودي في قائمة التراث العالمي."),
    Q("“Remarkable” is closest in meaning to:",["ordinary","impressive","dangerous","crowded"],1,"remarkable = لافت ومبهر."),
    Q("“Fragile” in paragraph 3 means:",["easily damaged","very large","recently built","extremely hot"],0,"fragile = سهل التضرر."),
    Q("According to experts, tourism growth should:",["maximise visitor numbers only","respect local communities and protect sites","stop completely","focus only on cities"],1,"الحماية واحترام المجتمعات المحلية."),
    Q("The writer's view of tourism is best described as:",["completely negative","balanced","purely enthusiastic","uninterested"],1,"يذكر الفوائد والتحديات معًا.")]},

{id:"R13",lvl:"B2",t:"The Science of Habits",ta:"علم العادات",mins:3,
 text:["Why is it so easy to check your phone and so hard to start your homework? Researchers who study habits explain that many of our daily actions are not really decisions at all. Once a behaviour is repeated often enough in the same situation, the brain begins to perform it automatically.",
 "Psychologists describe a habit as a loop with three parts: a cue, a routine and a reward. The cue might be a notification sound; the routine is picking up the phone; the reward is the small pleasure of new information. Because the reward arrives instantly, the loop becomes stronger every time.",
 "The good news is that the same mechanism can be used to build positive habits. Linking a new behaviour to an existing cue – for example, reading for ten minutes straight after dinner – and making the first step very small can dramatically increase the chances of success. Consistency, it turns out, matters far more than motivation."],
 gloss:[["automatically","تلقائيًا"],["cue","إشارة / محفّز"],["mechanism","آلية"],["consistency","الاستمرارية"]],
 q:[Q("What is the passage mainly about?",["How habits form and how to use them positively","Why phones are dangerous","The history of psychology","How to skip dinner"],0,"تكوّن العادات وتوظيفها."),
    Q("According to researchers, many daily actions are:",["careful decisions","automatic","random","impossible to change"],1,"the brain performs it automatically."),
    Q("What are the three parts of the habit loop?",["Cue, routine, reward","Start, middle, end","Goal, plan, result","Sound, light, touch"],0,"cue – routine – reward."),
    Q("In the phone example, what is the cue?",["Picking up the phone","A notification sound","New information","The homework"],1,"الإشعار هو المحفّز."),
    Q("Why does the phone habit become stronger?",["The reward is instant","The phone is expensive","Parents allow it","It is boring"],0,"the reward arrives instantly."),
    Q("“Mechanism” in paragraph 3 is closest in meaning to:",["process","machine","reward","problem"],0,"mechanism = آلية / عملية."),
    Q("Which strategy does the writer recommend?",["Waiting for motivation","Linking a new habit to an existing cue","Using the phone more","Studying only at weekends"],1,"ربط العادة الجديدة بمحفّز موجود."),
    Q("The final sentence suggests that:",["motivation is useless","doing something regularly matters more than feeling motivated","habits cannot change","rewards are harmful"],1,"الاستمرارية أهم من الحماس.")]},

{id:"R14",lvl:"B2",t:"Robots in Hospitals",ta:"الروبوتات في المستشفيات",mins:3,
 text:["When people imagine robots in hospitals, they often picture machines replacing doctors. The reality is less dramatic but arguably more useful. Most hospital robots today perform repetitive or physically demanding tasks, freeing human staff to focus on patients.",
 "Delivery robots, for instance, carry medicines and lab samples along corridors day and night, while disinfection robots use ultraviolet light to clean rooms more thoroughly than is possible by hand. In operating theatres, surgical robots allow doctors to make extremely precise movements through tiny cuts, which can reduce pain and shorten recovery times.",
 "Nevertheless, these systems are costly, and they depend on skilled people to operate and maintain them. Critics also warn that technology must never reduce the human contact that patients value. As one nurse put it, “A robot can bring the medicine, but it cannot hold a frightened patient's hand.”"],
 gloss:[["repetitive","متكرر"],["thoroughly","بدقة وشمول"],["precise","دقيق"],["costly","مكلف"]],
 q:[Q("What is the passage mainly about?",["How robots support hospital staff, and their limits","Robots will replace all doctors","How to build a robot","Hospital food"],0,"الفوائد والحدود."),
    Q("What kind of tasks do most hospital robots perform?",["Diagnosing illnesses","Repetitive or physically demanding tasks","Talking to patients","Writing prescriptions"],1,"repetitive or physically demanding."),
    Q("How do disinfection robots clean rooms?",["With water","With ultraviolet light","With chemicals only","With brushes"],1,"ultraviolet light."),
    Q("What is one benefit of surgical robots?",["They work without doctors","They can shorten recovery times","They are cheap","They replace nurses"],1,"shorten recovery times."),
    Q("“Costly” in paragraph 3 means:",["cheap","expensive","rare","new"],1,"costly = مكلف."),
    Q("What do critics warn about?",["Robots are too slow","Technology may reduce human contact","Robots are too small","Hospitals are too big"],1,"تقليل التواصل الإنساني."),
    Q("The nurse's quotation suggests that:",["robots are useless","human care cannot be replaced","patients prefer robots","nurses fear robots"],1,"اللمسة الإنسانية لا تُستبدل."),
    Q("The word “arguably” in paragraph 1 shows that the writer:",["is completely certain","is giving an opinion that could be debated","disagrees completely","is quoting a doctor"],1,"arguably = يمكن القول (رأي قابل للنقاش).")]}
);

{id:"R15",lvl:"B2",t:"Water from the Sea",ta:"الماء من البحر",mins:3,
 text:["Saudi Arabia has no permanent rivers, very little rainfall and a rapidly growing population. Meeting the demand for fresh water is therefore one of the country's greatest challenges.",
 "Much of the solution comes from the sea. Desalination plants remove salt from seawater to make it safe to drink, and the Kingdom is one of the largest producers of desalinated water in the world. The process, however, uses large amounts of energy, and the very salty water left over, known as brine, can harm marine life if it is not handled carefully.",
 "For this reason, engineers are exploring solar-powered plants and better ways to manage brine. At the same time, experts argue that technology alone is not enough. Reducing waste at home, repairing leaking pipes and using smart irrigation on farms could save enormous quantities of water."],
 gloss:[["permanent","دائم"],["desalination","تحلية"],["brine","المياه شديدة الملوحة"],["irrigation","الري"]],

    Q("What do desalination plants do?",["Add salt to water","Remove salt from seawater","Clean rivers","Produce electricity"],1,"remove salt from seawater."),
    Q("What is “brine”?",["Fresh drinking water","The very salty water left over","A type of fish","Rain water"],1,"المياه المالحة المتبقية."),
    Q("Which problem of desalination is mentioned?",["It is too quiet","It uses a lot of energy","It is too slow to build","It makes water sweet"],1,"uses large amounts of energy."),
    Q("What are engineers exploring?",["Solar-powered plants","Building rivers","Importing ice","Stopping desalination"],0,"solar-powered plants."),
    Q("“Enormous” is closest in meaning to:",["tiny","huge","clean","expensive"],1,"enormous = ضخم."),
    Q("According to experts, what is needed besides technology?",["More factories","Reducing waste and repairing pipes","Building rivers","Using more water"],1,"ترشيد الاستهلاك وإصلاح التسربات."),
    Q("The writer's main purpose is to:",["explain a challenge and possible solutions","advertise a product","tell a personal story","criticise farmers"],0,"مشكلة ثم حلول.")]},

{id:"R16",lvl:"B2",t:"Ibn al-Haytham",ta:"ابن الهيثم",mins:3,
 text:["Long before modern laboratories existed, a scholar named Ibn al-Haytham was changing the way people understood light and vision. Born in Basra around 965 CE, he later worked in Cairo, where he wrote his famous Book of Optics.",
 "At the time, many thinkers believed that we see because our eyes send out rays towards objects. Ibn al-Haytham argued the opposite: light travels from objects into the eye. More importantly, he did not rely on argument alone. He designed careful experiments, recorded his observations and tested his ideas again and again – an approach that closely resembles the modern scientific method.",
 "His work on the camera obscura, a dark room with a small hole that projects an upside-down image, helped later scientists understand how cameras and the human eye work. Today, he is often described as one of the founders of experimental science."],
 gloss:[["scholar","عالِم"],["optics","البصريات"],["resembles","يشبه"],["projects","يُسقط (صورة)"]],
 q:[Q("What is the passage mainly about?",["Ibn al-Haytham's contributions to science","How to build a camera","The history of Basra","Modern laboratories"],0,"إسهامات ابن الهيثم."),
    Q("Where was Ibn al-Haytham born?",["Cairo","Basra","Baghdad","Damascus"],1,"Born in Basra."),
    Q("What did many thinkers believe about vision at that time?",["Light enters the eye from objects","The eyes send out rays","We see with the brain only","Vision cannot be explained"],1,"العين ترسل أشعة."),
    Q("What made his approach special?",["He relied only on argument","He used careful experiments and observation","He copied older books","He worked only at night"],1,"التجربة والملاحظة."),
    Q("“Resembles” in paragraph 2 means:",["is similar to","is different from","replaces","criticises"],0,"resembles = يشبه."),
    Q("What does a camera obscura produce?",["A colourful painting","An upside-down image","A loud sound","A mirror"],1,"upside-down image."),
    Q("His work helped later scientists understand:",["how cameras and the eye work","how to travel","how plants grow","how to make glass"],0,"الكاميرات والعين البشرية."),
    Q("Why is he called a founder of experimental science?",["He built the first laboratory","He tested ideas through repeated experiments","He lived a long life","He wrote poetry"],1,"اختبار الأفكار بالتجربة المتكررة.")]},

{id:"R17",lvl:"B2",t:"Teenagers and Social Media",ta:"المراهقون ووسائل التواصل",mins:3,
 text:["Social media is now part of daily life for most teenagers. It allows them to stay in touch with friends, discover new interests and even share their own creative work with a global audience.",
 "However, studies suggest that the way young people use these platforms matters more than the amount of time they spend on them. Actively messaging friends or creating content tends to be linked with positive feelings, while endlessly scrolling and comparing oneself to carefully edited photos is more often associated with anxiety and low self-esteem.",
 "Rather than banning social media, many experts recommend teaching digital skills: recognising misleading information, protecting personal data and noticing how certain apps make us feel. Setting phone-free times, such as during meals and the hour before sleep, is another simple step that many families find helpful."],
 gloss:[["platforms","منصات"],["scrolling","التمرير"],["self-esteem","تقدير الذات"],["misleading","مضلِّل"]],
 q:[Q("What is the passage mainly about?",["How teenagers can use social media more healthily","Why social media should be banned","How to take better photos","The history of the internet"],0,"الاستخدام الصحي."),
    Q("Which benefit of social media is mentioned?",["Earning money quickly","Staying in touch with friends","Sleeping better","Better handwriting"],1,"stay in touch with friends."),
    Q("According to studies, what matters more than time spent?",["The type of phone","The way platforms are used","The number of apps","The price of data"],1,"the way young people use these platforms."),
    Q("Endless scrolling is associated with:",["positive feelings","anxiety and low self-esteem","better grades","more friends"],1,"القلق وتدني تقدير الذات."),
    Q("“Misleading” in paragraph 3 means:",["giving a false idea","very long","very popular","helpful"],0,"misleading = مضلِّل."),
    Q("What do experts recommend instead of banning?",["Buying new phones","Teaching digital skills","Using it all night","Deleting all photos"],1,"teaching digital skills."),
    Q("When are phone-free times suggested?",["During meals and before sleep","During exams only","In the morning only","At school only"],0,"وقت الوجبات وقبل النوم."),
    Q("The writer's approach to social media is:",["balanced and practical","completely negative","completely positive","confused"],0,"يعرض الإيجابيات والسلبيات ويقدم حلولًا.")]},

{id:"R18",lvl:"B1",t:"The Journey of Paper",ta:"رحلة الورق",mins:2,
 text:["Paper is so common today that we rarely think about where it came from. According to Chinese records, an official called Cai Lun improved the process of making paper around the year 105 CE, using tree bark, old cloth and fishing nets.",
 "For hundreds of years, the method remained mostly in China. Then, in the eighth century, papermaking reached the city of Samarkand in Central Asia, and soon afterwards paper mills appeared in Baghdad. Paper was much cheaper than parchment made from animal skin, so books became easier to produce, and libraries grew quickly across the Islamic world.",
 "From there, the technique travelled to Spain and the rest of Europe. Without this long journey, the spread of knowledge – and later the printing press – would have been much slower."],
 gloss:[["official","مسؤول"],["bark","لحاء الشجر"],["parchment","رَق (جلد للكتابة)"],["technique","تقنية"]],
 q:[Q("What is the passage mainly about?",["How papermaking spread around the world","How to recycle paper","The life of Cai Lun only","Printing machines"],0,"انتشار صناعة الورق."),
    Q("Who improved papermaking in China?",["Cai Lun","Ibn Sina","A Spanish king","A Baghdad merchant"],0,"Cai Lun."),
    Q("Which materials were used?",["Plastic and glass","Tree bark, old cloth and fishing nets","Animal skin only","Stones"],1,"اللحاء والقماش والشباك."),
    Q("Where did papermaking reach in the eighth century?",["London","Samarkand","Tokyo","Cairo"],1,"Samarkand."),
    Q("Why did libraries grow quickly?",["Paper was cheaper than parchment","Books were banned elsewhere","People stopped reading","Paper was heavy"],0,"الورق أرخص من الرَّق."),
    Q("“Technique” in paragraph 3 is closest in meaning to:",["method","material","journey","library"],0,"technique = method."),
    Q("Where did the technique go after the Islamic world?",["China","Spain and Europe","America","India"],1,"to Spain and the rest of Europe."),
    Q("The last sentence suggests that paper:",["slowed down learning","helped knowledge spread faster","was unimportant","was invented in Europe"],1,"سرّع انتشار المعرفة.")]},

{id:"R19",lvl:"B2",t:"Why Bees Matter",ta:"لماذا يهمنا النحل؟",mins:3,
 text:["Bees are small, but their role in the world's food system is enormous. As they move from flower to flower collecting nectar, they carry pollen that allows plants to produce fruits and seeds. Many crops, from almonds to apples, depend heavily on this process, known as pollination.",
 "In recent decades, however, beekeepers in many countries have reported worrying losses. Scientists point to a combination of causes rather than a single one: the loss of wild flowers, certain pesticides, parasites and diseases, and extreme weather linked to climate change.",
 "Protecting bees does not require dramatic action from everyone. Planting local flowering plants, avoiding unnecessary chemicals in gardens and buying honey from responsible local producers all make a difference. Some cities have even created “bee corridors” – chains of gardens and green roofs that help insects move safely through urban areas."],
 gloss:[["nectar","رحيق"],["pollen","حبوب اللقاح"],["pesticides","مبيدات"],["urban","حضري"]],
 q:[Q("What is the passage mainly about?",["Why bees matter, the threats they face, and how to help","How honey is made","Why bees are dangerous","The history of farming"],0,"الأهمية والمخاطر والحلول."),
    Q("What is pollination?",["Making honey","Carrying pollen so plants produce fruits and seeds","Killing insects","Building hives"],1,"نقل حبوب اللقاح."),
    Q("Which crops are mentioned as depending on bees?",["Rice and wheat","Almonds and apples","Potatoes and carrots","Dates and olives"],1,"from almonds to apples."),
    Q("According to scientists, bee losses are caused by:",["one single disease","a combination of causes","beekeepers","cold weather only"],1,"a combination of causes."),
    Q("“Worrying” in paragraph 2 means:",["causing concern","very small","expected","funny"],0,"worrying = مثير للقلق."),
    Q("Which action is NOT suggested?",["Planting local flowers","Avoiding unnecessary chemicals","Buying honey from responsible producers","Destroying beehives"],3,"تدمير الخلايا غير مذكور طبعًا."),
    Q("What are “bee corridors”?",["Roads for trucks","Chains of gardens and green roofs","Honey shops","Underground tunnels"],1,"سلاسل حدائق وأسطح خضراء."),
    Q("The writer believes that protecting bees:",["is impossible","can be supported by small everyday actions","only matters to farmers","requires moving to the countryside"],1,"does not require dramatic action.")]},

{id:"R20",lvl:"B1",t:"My First Day",ta:"يومي الأول",mins:2,
 text:["When my family moved from Dammam to Riyadh last year, I was terrified of my first day at a new school. I didn't know anyone, and I was sure that everyone already had their own group of friends.",
 "In the morning, I stood alone near the classroom door, pretending to read my timetable. Then a girl with a bright smile came over and asked if I was new. Her name was Lama. She showed me where the library and the canteen were, and at break time she introduced me to her friends.",
 "By the end of the week, I felt much more comfortable. I realised that many of my classmates had also been nervous on their first day. Now, whenever a new student joins our class, I try to do for them what Lama did for me."],
 gloss:[["terrified","مذعورة / خائفة جدًا"],["pretending","تتظاهر"],["canteen","المقصف"],["introduced","عرّفتني"]],
 q:[Q("Why was the writer nervous?",["She had failed an exam","She didn't know anyone at the new school","She was late","She lost her bag"],1,"لا تعرف أحدًا."),
    Q("Where did the writer move from?",["Riyadh","Dammam","Jeddah","Abha"],1,"from Dammam to Riyadh."),
    Q("Why did she pretend to read her timetable?",["She needed a room number","She felt alone and awkward","The teacher asked her","It was very long"],1,"كانت وحيدة ومحرجة."),
    Q("What did Lama NOT do?",["Show her the library","Introduce her to friends","Show her the canteen","Help her with homework"],3,"الواجب غير مذكور."),
    Q("“Terrified” is closest in meaning to:",["very excited","very frightened","very tired","very proud"],1,"terrified = خائفة جدًا."),
    Q("How did the writer feel by the end of the week?",["Still terrified","More comfortable","Angry","Bored"],1,"much more comfortable."),
    Q("What did she realise about her classmates?",["They were unfriendly","Many had also been nervous at first","They were older","They came from Dammam"],1,"كثيرات توترن في يومهن الأول."),
    Q("What lesson does the story teach?",["Moving is always bad","Small acts of kindness can make a big difference","Timetables are important","New students should stay alone"],1,"اللطف الصغير يصنع فرقًا كبيرًا.")]},

{id:"R21",lvl:"C1",t:"The Paradox of Choice",ta:"مفارقة الاختيار",mins:4,
 text:["It seems obvious that more choice leads to greater satisfaction. If one shop offers five types of jam and another offers fifty, surely the second will make customers happier. Yet a well-known study found the opposite: shoppers who saw a large display were more likely to stop and look, but far less likely to actually buy anything.",
 "The psychologist Barry Schwartz calls this the “paradox of choice”. When options multiply, so does the effort required to compare them, and so does the fear of choosing wrongly. Even after a decision, people with many alternatives tend to imagine how the rejected options might have been better, which reduces their enjoyment of what they chose.",
 "Schwartz distinguishes between “maximisers”, who seek the best possible option, and “satisficers”, who look for one that is good enough. Somewhat counterintuitively, satisficers often report being happier. The lesson is not that choice is bad, but that beyond a certain point, additional options can become a burden rather than a freedom."],
 gloss:[["satisfaction","الرضا"],["multiply","تتضاعف"],["counterintuitively","على عكس المتوقع"],["burden","عبء"]],
 q:[Q("What is the passage mainly about?",["Why too many options can reduce satisfaction","How to make jam","Why shops should close","The life of Barry Schwartz"],0,"فكرة مفارقة الاختيار."),
    Q("In the study, shoppers who saw a large display were:",["more likely to buy","more likely to stop but less likely to buy","not interested at all","angry"],1,"توقفوا أكثر واشتروا أقل."),
    Q("According to Schwartz, what increases as options multiply?",["Happiness","The effort to compare and the fear of choosing wrongly","Prices","Shop size"],1,"الجهد والخوف من الخطأ."),
    Q("Why might people enjoy their choice less?",["They imagine the rejected options were better","The product is expensive","They cannot find the shop","They choose too quickly"],0,"التفكير في البدائل المرفوضة."),
    Q("Who are “satisficers”?",["People who seek the best possible option","People who look for a good-enough option","Shop owners","Psychologists"],1,"good enough."),
    Q("“Counterintuitively” suggests the result is:",["expected","surprising","harmful","scientific"],1,"على عكس المتوقع."),
    Q("“Burden” in the last sentence means:",["a heavy responsibility","a gift","a choice","a reward"],0,"burden = عبء."),
    Q("The writer's conclusion is that:",["choice is always bad","beyond a certain point more options become a problem","maximisers are happier","shops should offer one product"],1,"الخيارات الزائدة تصير عبئًا بعد حد معين.")]},

{id:"R22",lvl:"B2",t:"Arabs in Space",ta:"عرب في الفضاء",mins:3,
 text:["In June 1985, Prince Sultan bin Salman became the first Arab and the first Muslim to travel into space when he joined a mission aboard the American space shuttle Discovery. During the seven-day flight, he took part in experiments and photographed the Earth, including the Arabian Peninsula.",
 "Almost four decades later, in May 2023, Rayyanah Barnawi made history as the first Saudi woman in space. A biomedical researcher specialising in stem cells, she spent about ten days on a mission to the International Space Station with fellow Saudi astronaut Ali AlQarni, carrying out scientific experiments.",
 "Their missions have inspired a new generation of students across the region. Their stories show that reaching space is not the result of luck but of years of study in science and mathematics, persistence after failure and the courage to pursue ambitious goals."],
 gloss:[["mission","مهمة"],["aboard","على متن"],["stem cells","الخلايا الجذعية"],["persistence","المثابرة"]],
 q:[Q("What is the passage mainly about?",["Pioneering Arab astronauts and their example","How rockets work","The history of NASA","Life on the Moon"],0,"رواد الفضاء العرب."),
    Q("When did Prince Sultan bin Salman go to space?",["1969","1985","2003","2023"],1,"June 1985."),
    Q("Which spacecraft did he travel on?",["Apollo 11","The space shuttle Discovery","A Russian rocket","A private plane"],1,"space shuttle Discovery."),
    Q("What was Rayyanah Barnawi's achievement?",["First Arab in space","First Saudi woman in space","First person on the Moon","First female pilot"],1,"أول امرأة سعودية في الفضاء."),
    Q("What is Barnawi's field of research?",["Stem cells","Volcanoes","Astronomy only","Computer games"],0,"specialising in stem cells."),
    Q("“Persistence” in paragraph 3 means:",["continuing despite difficulties","giving up","luck","speed"],0,"المثابرة."),
    Q("Who travelled with Barnawi?",["Sultan bin Salman","Ali AlQarni","Neil Armstrong","No one"],1,"Ali AlQarni."),
    Q("According to the passage, reaching space depends on:",["luck","study, persistence and courage","money only","age"],1,"الدراسة والمثابرة والشجاعة.")]},

{id:"R23",lvl:"B1",t:"A Smarter Breakfast",ta:"فطور أذكى",mins:2,
 text:["Nutrition experts often call breakfast the most important meal of the day, although researchers still debate exactly how important it is. What most agree on is that the type of breakfast matters a great deal.",
 "A breakfast full of sugar, such as sweet cereals or pastries, gives quick energy but often leads to tiredness and hunger an hour or two later. In contrast, meals that combine protein, fibre and healthy fats – for example, eggs with wholemeal bread, yoghurt with fruit, or ful medames with vegetables – release energy slowly and help students concentrate until lunch.",
 "For those who have little time in the morning, simple options work well: a banana with a handful of nuts, or a glass of milk and some dates. Drinking water is also important, since even mild dehydration can make it harder to think clearly."],
 gloss:[["nutrition","التغذية"],["debate","يتناقش / يختلف"],["release","يُطلق"],["dehydration","الجفاف"]],
 q:[Q("What is the passage mainly about?",["Choosing a healthy breakfast","Why lunch is important","How to cook eggs","The history of cereals"],0,"اختيار فطور صحي."),
    Q("What do researchers still debate?",["Whether sugar is sweet","Exactly how important breakfast is","How to make bread","The price of fruit"],1,"how important it is."),
    Q("What is the problem with a sugary breakfast?",["It is expensive","It leads to tiredness and hunger later","It takes too long","It has too much protein"],1,"تعب وجوع بعد ساعة أو ساعتين."),
    Q("Which meal releases energy slowly?",["Pastries","Eggs with wholemeal bread","Sweet cereal","Sweet juice"],1,"بروتين + ألياف."),
    Q("“In contrast” introduces:",["a similar idea","a different idea","an example","a conclusion"],1,"للمقابلة بين فكرتين."),
    Q("Which quick option is suggested?",["A banana with nuts","A chocolate bar","Coffee only","Nothing"],0,"a banana with a handful of nuts."),
    Q("Why is drinking water important?",["It replaces breakfast","Dehydration can make thinking harder","It is sweet","It gives protein"],1,"الجفاف يصعّب التفكير."),
    Q("“Mild” in the last sentence means:",["slight","severe","sudden","hot"],0,"mild = خفيف.")]}
);

{id:"S17",ta:"كلمات إنجليزية أصلها عربي",type:"محاضرة",

/* ================= مولّد: اكتشاف الجملة الصحيحة/الخاطئة من أخطاء الدروس ================= */
(function(){
  const SKIP=["It was him who called me.","He said he is busy.","She has been finishing the book.","He mustn't be the new teacher.",
    "When I arrived, the train already left.","While I watched TV, my brother called.","The man, I met yesterday, is a lawyer."];
  const pairs=[]; LESSONS.forEach(L=>L.mis.forEach(m=>{ if(SKIP.indexOf(m[0])<0) pairs.push({bad:m[0],good:m[1],note:m[2],src:L.ta}); }));
  const goods=LESSONS.flatMap(L=>L.ex.map(e=>e[0]));
  const pick=(arr,n,avoid)=>{ const out=[]; const s=shuffle(arr); for(const x of s){ if(out.length>=n) break; if(avoid.indexOf(x)<0 && out.indexOf(x)<0) out.push(x);} return out; };
  pairs.forEach((p,i)=>{
    const others=pairs.filter((x,j)=>j!==i).map(x=>x.bad);
    const o1=shuffle([p.good].concat(pick(others,3,[p.good])));
    COMP.push({t:"mcq",q:"Which sentence is grammatically correct?",o:o1,a:o1.indexOf(p.good),e:p.note+" (الصواب: "+p.good+")",gen:true});
    const o2=shuffle([p.bad].concat(pick(goods,3,[p.bad])));
    COMP.push({t:"mcq",q:"Which sentence contains a grammatical error?",o:o2,a:o2.indexOf(p.bad),e:"الخطأ: "+p.bad+" ← الصواب: "+p.good+" — "+p.note,gen:true});
  });
})();

});

function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e;}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function norm(s){return String(s).toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(/[.،؟?!]/g,"").replace(/\s+/g," ").trim();}
function isAr(s){return /^[\u0600-\u06FF]/.test(String(s).trim());}

/* ================= صوت ونطق ================= */
let AC=null, sndOn=true;
function beep(type){
  if(!sndOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = type==="ok"?[[660,0],[880,.09]] : type==="badge"?[[660,0],[880,.08],[1175,.16]] : [[190,0]];
    seq.forEach(([f,t])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type = type==="no"?"square":"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.18);
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.2);
    });
  }catch(e){}
}
function speak(text, btn){
  if(!("speechSynthesis" in window)) return toast("المتصفح لا يدعم النطق الصوتي");
  const clean = String(text).replace(/___/g," blank ").replace(/[\u0600-\u06FF]+/g," ").replace(/\s+/g," ").trim();
  if(!clean) return;
  ttsKill();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang="en-US"; u.rate=TTS_RATE;
  if(btn){ btn.classList.add("playing"); u.onend=()=>btn.classList.remove("playing"); u.onerror=()=>btn.classList.remove("playing"); }
  speechSynthesis.speak(u);
}
let SPK_ON=null;
function spkBtn(text){
  const b = el("button","spk","<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12'/></svg>"); b.type="button"; b.title="استمع للنطق (اضغط مرة أخرى للإيقاف)";
  b.setAttribute("aria-label","استمع للنطق");
  b.onclick=(e)=>{
    e.stopPropagation();
    if(SPK_ON===b){ ttsKill(); b.classList.remove("playing"); b.innerHTML="<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12'/></svg>"; SPK_ON=null; return; }
    if(SPK_ON){ SPK_ON.classList.remove("playing"); SPK_ON.innerHTML="<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12'/></svg>"; }
    ttsKill(); SPK_ON=b; b.innerHTML="<svg class='i' viewBox='0 0 24 24' fill='currentColor' stroke='currentColor'><path d='M7 7h10v10H7z'/></svg>";
    speak(text,b);
    const u=setInterval(()=>{
      let sp=false; try{ sp=speechSynthesis.speaking; }catch(err){}
      if(!sp){ clearInterval(u); if(SPK_ON===b){ b.classList.remove("playing"); b.innerHTML="<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12'/></svg>"; SPK_ON=null; } }
    },400);
  };
  return b;
}

/* ================= مشغّل النطق ================= */
let TTS_CUR=null;         // المشغّل النشط حاليًا
let TTS_RATE=0.85;        // السرعة المختارة
function ttsSupported(){ return typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined"; }
function ttsKill(){
  if(TTS_CUR && TTS_CUR.reset) { const r=TTS_CUR.reset; TTS_CUR=null; r(); }
  try{ speechSynthesis.cancel(); }catch(e){}
}
function splitChunks(text){
  const parts=String(text).replace(/\s+/g," ").split(/(?<=[.!?])\s+/);
  const out=[]; let buf="";
  parts.forEach(p=>{ if((buf+" "+p).length>170){ if(buf)out.push(buf.trim()); buf=p; } else buf+=" "+p; });
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[String(text)];
}

/* يبني مشغّلًا كامل التحكم لنص إنجليزي */
function makePlayer(text, opts){
  opts=opts||{};
  const wrap=el("div","player");
  const chunks=splitChunks(text);
  let playing=false, paused=false, done=0, plays=0, keep=null;

  const bar=el("div","bar"); const fi=el("i"); fi.style.width="0%"; fi.style.transition="width .25s"; bar.appendChild(fi);
  const stat=el("div","pstat","جاهز للتشغيل");
  const btns=el("div","pbtns");
  const play=el("button","pbig","<svg class='i' viewBox='0 0 24 24' fill='currentColor' stroke='currentColor'><path d='M8 5v14l11-7z'/></svg> تشغيل");
  const pause=el("button","pctl","<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M9 5v14M15 5v14'/></svg> إيقاف مؤقت"); pause.disabled=true;
  const stop=el("button","pctl","<svg class='i' viewBox='0 0 24 24' fill='currentColor' stroke='currentColor'><path d='M7 7h10v10H7z'/></svg> إيقاف"); stop.disabled=true;
  btns.appendChild(play); btns.appendChild(pause); btns.appendChild(stop);

  const sp=el("div","speeds"); sp.appendChild(el("span","","السرعة:"));
  const spBtns=[["<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M12 15l4-4M3.5 17a9 9 0 1 1 17 0'/></svg> بطيء",0.6],["عادي",0.85],["<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M13 2 4 14h7l-1 8 9-12h-7z'/></svg> أسرع",1.05]].map(([lbl,val])=>{
    const b=el("button","spd",lbl);
    b.setAttribute("aria-pressed",String(TTS_RATE===val));
    b.onclick=()=>{ TTS_RATE=val; spBtns.forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.v===val)));
      if(playing){ restart(); } };
    b.dataset.v=val; sp.appendChild(b); return b;
  });

  function ui(){
    play.disabled = playing && !paused;
    pause.disabled = !playing;
    stop.disabled = !playing;
    pause.innerHTML=paused ? "<svg class='i' viewBox='0 0 24 24' fill='currentColor' stroke='currentColor'><path d='M8 5v14l11-7z'/></svg> متابعة" : "<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M9 5v14M15 5v14'/></svg> إيقاف مؤقت";
    play.innerHTML = playing ? "<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12'/></svg> يعمل الآن" : (plays? "<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3'/></svg> إعادة التشغيل" : "<svg class='i' viewBox='0 0 24 24' fill='currentColor' stroke='currentColor'><path d='M8 5v14l11-7z'/></svg> تشغيل");
    if(opts.limit && plays>=opts.limit && !playing){ play.disabled=true; play.textContent="انتهت مرات الاستماع"; }
  }
  function reset(){
    playing=false; paused=false; done=0;
    if(keep){ clearInterval(keep); keep=null; }
    fi.style.width="0%";
    stat.innerHTML = opts.limit ? ("مرات الاستماع: <b>"+plays+"</b> من "+opts.limit) : ("مرات الاستماع: <b>"+plays+"</b>");
    ui();
  }
  function start(){
    if(!ttsSupported()){ stat.textContent="متصفحك لا يدعم النطق الصوتي — استخدمي زر عرض النص."; return; }
    if(opts.limit && plays>=opts.limit) return;
    ttsKill();
    TTS_CUR={reset:reset};
    plays++; playing=true; paused=false; done=0;
    try{ speechSynthesis.cancel(); }catch(e){}
    chunks.forEach((c,i)=>{
      const u=new SpeechSynthesisUtterance(c);
      u.lang="en-US"; u.rate=TTS_RATE;
      u.onend=()=>{
        if(!playing) return;
        done++; fi.style.width=Math.round(done/chunks.length*100)+"%";
        stat.innerHTML="يعمل… <b>"+Math.round(done/chunks.length*100)+"%</b>";
        if(done>=chunks.length){ playing=false; TTS_CUR=null; reset(); }
      };
      u.onerror=()=>{ if(playing){ playing=false; TTS_CUR=null; reset(); } };
      try{ speechSynthesis.speak(u); }catch(e){}
    });
    /* بعض المتصفحات توقف النطق الطويل تلقائيًا — هذه تبقيه حيًا */
    keep=setInterval(()=>{
      if(!playing||paused) return;
      try{ if(speechSynthesis.speaking){ speechSynthesis.pause(); speechSynthesis.resume(); } }catch(e){}
    },9000);
    stat.innerHTML="يعمل… <b>0%</b>";
    ui();
  }
  function restart(){ const was=plays; ttsKill(); plays=Math.max(0,was-1); start(); }

  play.onclick=start;
  pause.onclick=()=>{
    if(!playing) return;
    try{
      if(paused){ speechSynthesis.resume(); paused=false; stat.innerHTML="يعمل… <b>"+Math.round(done/chunks.length*100)+"%</b>"; }
      else { speechSynthesis.pause(); paused=true; stat.textContent="متوقف مؤقتًا — اضغطي متابعة"; }
    }catch(e){}
    ui();
  };
  stop.onclick=()=>{ ttsKill(); stat.textContent="تم الإيقاف"; setTimeout(reset,600); };

  wrap.appendChild(btns); wrap.appendChild(bar); wrap.appendChild(stat); wrap.appendChild(sp);
  reset();
  return wrap;
}

function ring(pct, size, color, top, bottom){

/* ================= التسجيل والشارات ================= */
function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.badges[b.id] && b.chk(state)){
      state.badges[b.id]=true;
      beep("badge");
      toast("<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3'/></svg> شارة جديدة: "+b.n, true);
    }
  });
}
function record(key, ok, uid, opts){
  opts = opts||{};
  state.answered++; if(uid) state.qdone[uid]=true;
  if(String(key).indexOf("V")===0) state.vocabCount++;
  if(String(key).indexOf("R")===0){ state.readDone = state.readDone||{}; state.readDone[key]=true; }
  if(ok){
    state.right++; state.streak++; state.best=Math.max(state.best,state.streak);
    state.xp += (opts.hinted?5:10) + (state.streak%5===0?15:0);
    if(state.streak%5===0 && state.streak>0) toast("<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M12 22c4 0 7-2.7 7-6.5 0-4-3-6-4-9-2 1.5-2.5 4-2.5 4S11 8 9 6c-1 3-4 5-4 9.5C5 19.3 8 22 12 22z'/></svg> سلسلة "+state.streak+" — مكافأة 15 XP", true);
  } else { state.streak=0; }
  if(!state.stats[key]) state.stats[key]={r:0,w:0};
  state.stats[key][ok?"r":"w"]++;
  $("#xpNum").textContent=state.xp; $("#strNum").textContent=state.streak;
  checkBadges();
  updateFab();
  queueSave();
}
function addReview(q){
  if(state.review.some(x=>x.q===q.q)) return;
  state.review.push(q); updateFab(); queueSave();
}
function dropReview(q){ state.review = state.review.filter(x=>x.q!==q.q); updateFab(); }
function updateFab(){
  const f=$("#fab"); $("#fabN").textContent=state.review.length;
  f.classList.toggle("show", state.review.length>0);
}

/* ================= محرك الأسئلة ================= */
const KEYS=["A","B","C","D","E"];
function buildQ(q, meta){
  const box = el("div","qbox");
  if(meta){
    const h = el("div","qhead");
    if(meta.num) h.appendChild(el("span","k", meta.num));
    if(q.src) h.appendChild(el("span","", q.src));
    box.appendChild(h);
  }
  let check, hint;

  if(q.t==="mcq"){
    const t = el("div","qtext"+(isAr(q.q)?" ar":""), q.q);
    if(!isAr(q.q)) t.appendChild(spkBtn(q.q.replace(/___/g,"blank")));
    box.appendChild(t);
    const wrap = el("div","opts"); let picked=-1;
    const btns = q.o.map((o,i)=>{
      const b = el("button","opt"+(isAr(o)?" ar-opt":""), o);
      b.dataset.k = KEYS[i];
      b.onclick=()=>{picked=i; btns.forEach(x=>x.classList.remove("sel")); b.classList.add("sel");};
      wrap.appendChild(b); return b;
    });
    box.appendChild(wrap);
    hint = ()=>{ const wrong = btns.map((b,i)=>i).filter(i=>i!==q.a && !btns[i].classList.contains("gone"));
      shuffle(wrong).slice(0, Math.max(1,wrong.length-1)).forEach(i=>btns[i].classList.add("gone"));
      return "حذفنا خيارات خاطئة — اختر من الباقي."; };
    check = (reveal=true)=>{
      if(picked<0) return null;
      const ok = picked===q.a;
      if(reveal){ btns.forEach(b=>b.disabled=true); btns[q.a].classList.add("right");
        btns[q.a].classList.remove("sel","gone");
        if(!ok){btns[picked].classList.add("wrongpick"); btns[picked].classList.remove("sel");} }
      return ok;
    };
  }
  else if(q.t==="gap"){
    const t = el("div","qtext"+(isAr(q.q)?" ar":""));
    const parts = q.q.split("___");
    t.appendChild(document.createTextNode(parts[0]));
    const inp = el("input","gap"); inp.type="text"; inp.setAttribute("aria-label","اكتب الإجابة"); inp.autocomplete="off";
    t.appendChild(inp);
    t.appendChild(document.createTextNode(parts[1]||""));
    if(!isAr(q.q)) t.appendChild(spkBtn(q.q));
    box.appendChild(t);
    hint = ()=> "الإجابة تبدأ بحرف " + q.a[0].charAt(0).toUpperCase() + " وعدد حروفها " + q.a[0].replace(/\s/g,"").length + ".";
    check = (reveal=true)=>{
      const v = norm(inp.value); if(!v) return null;
      const ok = q.a.some(x=>norm(x)===v);
      if(reveal){ inp.disabled=true; inp.style.borderColor = ok?"var(--ok)":"var(--no)";
        if(!ok){ const s=el("span","",' → <b style="color:var(--ok)">'+q.a[0]+'</b>'); s.style.direction="ltr"; t.insertBefore(s, inp.nextSibling); } }
      return ok;
    };
  }
  else {
    box.appendChild(el("div","qtext ar","رتّب الكلمات لتكوّن جملة صحيحة:"));
    const build = el("div","build"); const chips = el("div","chips");
    let chosen=[];
    const chipEls = shuffle(q.w).map((w,i)=>{
      const c = el("button","chip-w",w);
      c.onclick=()=>{chosen.push({w,i}); c.classList.add("used"); paint();};
      chips.appendChild(c); return c;
    });
    function paint(){ build.textContent = chosen.map(c=>c.w).join(" ") || ""; }
    box.appendChild(build); box.appendChild(chips);
    const undo = el("button","btn ghost sm","↺ تراجع");
    undo.onclick=()=>{const l=chosen.pop(); if(l){chipEls[l.i].classList.remove("used"); paint();}};
    box.appendChild(undo);
    hint = ()=> "الجملة تبدأ بـ: " + q.a.split(" ")[0];
    check = (reveal=true)=>{
      if(!chosen.length) return null;
      const built = norm(chosen.map(c=>c.w).join(" "));
      const ok = [q.a].concat(q.alts||[]).some(x=>norm(x)===built);
      if(reveal){ chipEls.forEach(c=>c.classList.add("used")); undo.disabled=true;
        build.style.borderColor = ok?"var(--ok)":"var(--no)";
        if(!ok){ build.innerHTML = chosen.map(c=>c.w).join(" ") + '<div style="color:var(--ok);font-weight:600">'+q.a+'</div>'; } }
      return ok;
    };
  }
  return {node:box, check, hint, q};
}

function practiceQ(q, num, key, uid, onDone){
  const item = buildQ(q, {num:num});
  let hinted=false;
  const row = el("div","row mt");
  const btn = el("button","btn","تحقق من الإجابة");
  const hb = el("button","btn ghost sm","<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c.7.8 1 1.6 1 2.5h6c0-.9.3-1.7 1-2.5A6 6 0 0 0 12 2z'/></svg> تلميح");
  hb.onclick=()=>{ const msg = item.hint(); hinted=true; hb.disabled=true;
    const d = el("div","fb","<b>تلميح</b>"+msg); item.node.insertBefore(d, row); };
  row.appendChild(btn); row.appendChild(hb);
  item.node.appendChild(row);
  btn.onclick=()=>{
    const res = item.check(true);
    if(res===null){ btn.textContent="جاوب أولاً"; setTimeout(()=>btn.innerHTML="تحقق من الإجابة",1200); return; }
    btn.disabled=true; hb.disabled=true;
    item.node.classList.add(res?"correct":"wrong", res?"pop":"shake");
    const fb = el("div","fb "+(res?"ok":"no"));
    fb.innerHTML = "<b>"+(res?"إجابة صحيحة":"إجابة غير صحيحة")+"</b>"+q.e;
    if(!isAr(q.e)) fb.appendChild(spkBtn(q.e));
    item.node.appendChild(fb);
    if(res){ const x=el("div","xpfly","+"+(hinted?5:10)+" XP"); item.node.appendChild(x); setTimeout(()=>x.remove(),1200); }
    beep(res?"ok":"no");
    record(key, res, uid, {hinted:hinted});
    if(res) dropReview(q); else addReview(Object.assign({}, q, {src:q.src||key}));
    if(onDone) onDone(res);
  };
  return item.node;
}

/* ================= البنوك ================= */
const KEYNAME={GV:"الأفعال الشاذة",GA:"المقارنة والتفضيل","STEP-G":"ستيب: التراكيب","STEP-C":"ستيب: التحليل الكتابي","STEP-L":"ستيب: الاستماع",
 "STEP-R":"ستيب: مراجعة","STEP-reading":"ستيب: القراءة","STEP-structure":"ستيب: التراكيب","STEP-listening":"ستيب: الاستماع","STEP-composition":"ستيب: التحليل"};
function keyName(k){ const L=LESSONS.find(x=>x.id===k)||VOCAB.find(x=>x.id===k)||READING.find(x=>x.id===k); return L?L.ta:(KEYNAME[k]||k); }
function drillTotal(){
  return LESSONS.reduce((s,L)=>s+L.q.length,0) + READING.reduce((s,R)=>s+R.q.length,0) + LISTEN.reduce((s,S)=>s+S.q.length,0)
    + COMP.length + GEN.length + VOCAB.reduce((s,U)=>s+U.w.length,0);
}
const POOL=[];
LESSONS.forEach(L=>L.q.forEach((q,i)=>POOL.push(Object.assign({},q,{lvl:L.lvl, src:L.ta, key:L.id, uid:L.id+"-"+i}))));

function vocabQuestions(unit,n){
  const out=[], words=shuffle(unit.w).slice(0,n||unit.w.length), all=VOCAB.flatMap(u=>u.w);
  words.forEach((w,i)=>{
    const mode=i%3;
    if(mode===0){
      const opts=shuffle([w[2],...shuffle(all.filter(x=>x[2]!==w[2])).slice(0,3).map(x=>x[2])]);
      out.push({t:"mcq",q:"What does “"+w[0]+"” mean?",o:opts,a:opts.indexOf(w[2]),e:w[0]+" = "+w[2]+" — مثال: "+w[3],lvl:"V",src:unit.ta,key:unit.id});
    } else if(mode===1){
      const opts=shuffle([w[0],...shuffle(all.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[0])]);
      out.push({t:"mcq",q:"ما الكلمة الإنجليزية التي تعني: "+w[2]+"؟",o:opts,a:opts.indexOf(w[0]),e:w[2]+" = "+w[0]+" — مثال: "+w[3],lvl:"V",src:unit.ta,key:unit.id});
    } else {
      const first=w[0].split(" ")[0].split("–")[0].trim();
      const re=new RegExp("\\b"+first.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
      const sent=w[3].replace(re,"___");
      const forms=w[0].split(/[–\/]/).map(x=>x.trim()).filter(Boolean);
      out.push({t:"gap",q: sent.indexOf("___")>-1?sent:("اكتب بالإنجليزية: "+w[2]+" ← ___"),
        a: forms.length>1?forms:[first], e:"الكلمة المطلوبة: "+w[0]+" ("+w[2]+")",lvl:"V",src:unit.ta,key:unit.id});
    }
  });
  return out;
}

function acc(key){ const s=state.stats[key]; return s? Math.round(s.r/(s.r+s.w)*100):0; }

/* ================= تدريب مكثف ================= */
const drill={lvl:"الكل",type:"الكل"};
function drillPool(){
  let pool;
  if(drill.lvl==="مفردات") pool=VOCAB.flatMap(U=>vocabQuestions(U,4));
  else if(drill.lvl==="أفعال شاذة") pool=GEN.filter(q=>q.key==="GV");
  else if(drill.lvl==="المقارنة") pool=GEN.filter(q=>q.key==="GA");
  else { pool=POOL.filter(q=>drill.lvl==="الكل"||q.lvl===drill.lvl);
    if(drill.lvl==="الكل") pool=pool.concat(VOCAB.flatMap(U=>vocabQuestions(U,2)), shuffle(GEN).slice(0,40), shuffle(COMP).slice(0,60)); }
  if(drill.type!=="الكل") pool=pool.filter(q=>q.t===drill.type);
  return pool;
}

/* ---- تحدي الدقيقة ---- */
function startMinute(){
  go("drill");
  const v=$("#v-drill"); v.innerHTML="";
  const back=el("button","back","→ رجوع للتدريب"); back.onclick=renderDrill; v.appendChild(back);
  v.appendChild(el("h2","title","One-Minute Challenge"));
  v.appendChild(el("p","sub","سؤال يتبعه سؤال. كل إجابة صحيحة نقطة. أفضل نتيجة لك: "+state.bestMinute));
  const tm=el("div","timer");
  const t=el("div","t num","60"); const bar=el("div","bar"); const fill=el("i"); fill.style.width="100%"; bar.appendChild(fill);
  const sc=el("div","streakline","النقاط: <b class='num'>0</b>");
  tm.appendChild(t); tm.appendChild(bar); tm.appendChild(sc); v.appendChild(tm);
  const holder=el("div"); v.appendChild(holder);

  const pool=shuffle(POOL.concat(VOCAB.flatMap(U=>vocabQuestions(U,2))));
  let i=0, pts=0, left=60;
  const M={timer:null};
  state.minute=M;
  function nextQ(){
    holder.innerHTML="";
    const q=pool[i++ % pool.length];
    holder.appendChild(practiceQ(q,i,q.key,q.uid,(ok)=>{
      if(ok){pts++; sc.innerHTML="النقاط: <b class='num'>"+pts+"</b>";}
      setTimeout(()=>{ if(state.minute) nextQ(); }, ok?600:2200);
    }));
  }
  nextQ();
  M.timer=setInterval(()=>{
    left--; t.textContent=left; fill.style.width=(left/60*100)+"%";
    if(left<=10) tm.classList.add("low");
    if(left<=0){
      clearInterval(M.timer); state.minute=null;
      state.bestMinute=Math.max(state.bestMinute,pts); checkBadges();
      holder.innerHTML="";
      const r=el("div","result");
      r.appendChild(ring(Math.min(100,pts*6),140,"#FFD54A",String(pts),"نقطة"));
      r.appendChild(el("div","msg", pts>=12?"سرعة ممتازة! <svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M12 22c4 0 7-2.7 7-6.5 0-4-3-6-4-9-2 1.5-2.5 4-2.5 4S11 8 9 6c-1 3-4 5-4 9.5C5 19.3 8 22 12 22z'/></svg>":pts>=7?"جيد — حاول تتجاوز 12":"خذ وقتك في الدروس ثم أعد المحاولة"));
      const rw=el("div","row"); rw.style.justifyContent="center";
      const again=el("button","btn mark","إعادة التحدي"); again.onclick=startMinute;
      const ex=el("button","btn ghost","رجوع"); ex.onclick=renderDrill;
      rw.appendChild(again); rw.appendChild(ex); r.appendChild(rw);
      holder.appendChild(r); beep("badge");
    }
  },1000);
}

function startTest(lvl,n,title){
  let pool;
  if(lvl==="V") pool=VOCAB.flatMap(U=>vocabQuestions(U,5));
  else if(lvl==="الكل") pool=POOL.concat(VOCAB.flatMap(U=>vocabQuestions(U,2)));
  else pool=POOL.filter(q=>q.lvl===lvl);
  state.test={qs:shuffle(pool).slice(0,n),i:0,right:0,wrong:[],title:title};
  drawTest();
}
function startPlacement(){
  const pick=(lv,n)=>shuffle(POOL.filter(q=>q.lvl===lv)).slice(0,n);
  const qs=[].concat(pick("A1",4),pick("A2",4),pick("B1",4),pick("B2",4),pick("C1",2),
    shuffle(VOCAB.flatMap(U=>vocabQuestions(U,1))).slice(0,2));
  state.test={qs:qs,i:0,right:0,wrong:[],title:"اختبار تحديد المستوى",placement:true};
  drawTest();
}
function drawTest(){
  const T=state.test, v=$("#v-test"); v.innerHTML="";
  if(T.i>=T.qs.length) return testResult();
  v.appendChild(el("h2","title",T.title));
  const tm=el("div","timer");
  tm.appendChild(el("div","t num",(T.i+1)+"/"+T.qs.length));
  const bar=el("div","bar"); const fi=el("i"); fi.style.width=(T.i/T.qs.length*100)+"%"; bar.appendChild(fi);
  tm.appendChild(bar);
  tm.appendChild(el("div","streakline","صحيحة: "+T.right));
  v.appendChild(tm);
  const q=T.qs[T.i], item=buildQ(q,{});
  v.appendChild(item.node);
  const row=el("div","row mt");
  const last=T.i===T.qs.length-1;
  const next=el("button","btn", last?"إنهاء وعرض النتيجة":"السؤال التالي ←");
  next.onclick=()=>{
    const res=item.check(false);
    if(res===null){ next.textContent="جاوب أولاً"; setTimeout(()=>next.innerHTML=last?"إنهاء وعرض النتيجة":"السؤال التالي ←",1200); return; }
    record(q.key||"اختبار",res,q.uid);
    if(res){T.right++; dropReview(q);} else {T.wrong.push(q); addReview(q);}
    beep(res?"ok":"no");
    T.i++; drawTest(); window.scrollTo(0,0);
  };
  const quit=el("button","btn ghost","خروج"); quit.onclick=renderTest;
  row.appendChild(next); row.appendChild(quit); v.appendChild(row);
}
function testResult(){
  const T=state.test, v=$("#v-test"); v.innerHTML="";
  const pct=Math.round(T.right/T.qs.length*100);
  if(pct===100){ state.perfectTest=true; checkBadges(); }
  const msg = pct>=90?"ممتاز! مستواك قوي جدًا." : pct>=75?"جيد جدًا، بقيت مراجعة بسيطة." : pct>=50?"جيد — ركّز على الدروس أدناه." : "ارجع للدروس وخذ وقتك، ثم أعد الاختبار.";
  const r=el("div","result");
  const ringEl = ring(0,150, pct>=75?"#0C9A6C":pct>=50?"#FFD54A":"#DC2743", "0%","النتيجة");
  r.appendChild(ringEl);
  r.appendChild(el("div","msg","إجاباتك الصحيحة: "+T.right+" من "+T.qs.length+" — "+msg));
  const rw=el("div","row"); rw.style.justifyContent="center";
  const again=el("button","btn mark","اختبار آخر"); again.onclick=renderTest;
  const rev=el("button","btn ghost","<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M22 12h-6l-2 3h-4l-2-3H2M5 5h14l3 7v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5z'/></svg> صندوق أخطائي"); rev.onclick=openReview;
  rw.appendChild(again); rw.appendChild(rev); r.appendChild(rw);
  v.appendChild(r);
  /* حركة عدّ النتيجة */
  let cur=0; const circ=ringEl.querySelectorAll("circle")[1], len=parseFloat(circ.getAttribute("stroke-dasharray"));
  const iv=setInterval(()=>{ cur+=Math.max(1,Math.round(pct/25)); if(cur>=pct){cur=pct; clearInterval(iv);}
    ringEl.querySelector("b").textContent=cur+"%"; circ.setAttribute("stroke-dashoffset", len*(1-cur/100)); },40);

  if(T.placement){
    const order=["A1","A2","B1","B2","C1"], res={};
    order.forEach(lv=>{
      const tot=T.qs.filter(q=>q.lvl===lv).length;
      if(!tot) return;
      const bad=T.wrong.filter(q=>q.lvl===lv).length;
      res[lv]=Math.round((tot-bad)/tot*100);
    });
    let start=null;
    order.forEach(lv=>{ if(start===null && res[lv]!==undefined && res[lv]<70) start=lv; });
    const box=el("div","card"); box.style.marginTop="18px";
    box.appendChild(el("div","t","Score by Level"));
    order.forEach(lv=>{
      if(res[lv]===undefined) return;
      const r=el("div","lvlbar");
      r.appendChild(el("div","nm",lv));
      const bar=el("div","bar"); const fi=el("i"); fi.style.width=res[lv]+"%";
      fi.style.background = res[lv]>=70?"var(--ok)":res[lv]>=40?"var(--mark)":"var(--no)";
      bar.appendChild(fi); r.appendChild(bar);
      r.appendChild(el("div","pc",res[lv]+"%"));
      box.appendChild(r);
    });
    const target = start || "C1";
    const first = LESSONS.find(L=>L.lvl===target);
    box.appendChild(el("p","sub", !start ? "أداء قوي في كل المستويات — انتقل إلى دروس C1 ونصوص القراءة المتقدمة."
      : target==="A1" ? "ابدأ من أساسيات A1 وثبّتها جيدًا قبل الانتقال لما بعدها."
      : ("ابدأ من مستوى "+target+": ما قبله متمكّن منه، وهنا تبدأ الفجوة الحقيقية.")));
    const gob=el("button","btn mark","ابدأ من: "+first.ta);
    gob.onclick=()=>{ go("lessons"); openLesson(first.id); };
    box.appendChild(gob);
    v.appendChild(box);
  }
  if(T.wrong.length){

function startStepMock(){
  const R=shuffle(READING.filter(x=>x.lvl!=="C1"))[0];
  const items=[];
  shuffle(R.q).slice(0,5).forEach((q,i)=>items.push({q:Object.assign({},q,{src:"قراءة"}), sec:"reading", passage:i===0?R:null}));
  shuffle(POOL.filter(q=>q.t==="mcq"&&["B1","B2","A2"].indexOf(q.lvl)>-1)).slice(0,8)
    .forEach(q=>items.push({q:Object.assign({},q,{src:"تراكيب"}), sec:"structure"}));
  shuffle(LISTEN).slice(0,2).forEach(S=>{
    S.q.slice(0,2).forEach((q,i)=>items.push({q:Object.assign({},q,{src:"استماع"}), sec:"listening", audio:i===0?S:null}));
  });
  shuffle(COMP).slice(0,3).forEach(q=>items.push({q:Object.assign({},q,{src:"تحليل كتابي"}), sec:"composition"}));
  state.step={items:items, i:0, res:{reading:[0,0],structure:[0,0],listening:[0,0],composition:[0,0]}, wrong:[], left:20*60, passage:R};
  drawStepMock();
  state.stepTimer=setInterval(()=>{
    const S=state.step; if(!S) return;
    S.left--;
    const t=$("#stepClock");
    if(t){ const m=Math.floor(S.left/60), s=S.left%60; t.textContent=m+":"+(s<10?"0":"")+s; if(S.left<120) t.parentNode.classList.add("low"); }
    if(S.left<=0){ clearInterval(state.stepTimer); state.stepTimer=null; stepResult(true); }
  },1000);
}
const SECNAME={reading:"الاستيعاب المقروء",structure:"التراكيب النحوية",listening:"فهم المسموع",composition:"التحليل الكتابي"};
const SECW={reading:40,structure:30,listening:20,composition:10};

function drawStepMock(){
  const S=state.step, v=$("#v-step"); v.innerHTML="";

  tm.appendChild(clock);

  tm.appendChild(bar); tm.appendChild(el("div","streakline","الوقت المتبقي"));
  v.appendChild(tm);

  if(it.passage){
    const p=el("div","passage");
    p.appendChild(el("div","rmeta","<b>"+it.passage.t+"</b> — اقرأ النص ثم أجب عن الأسئلة الخمسة التالية"));
    it.passage.text.forEach(par=>{ const w=el("div","pw"); w.appendChild(el("p","",par)); p.appendChild(w); });
    v.appendChild(p);
  } else if(it.sec==="reading"){
    const rr=el("button","btn ghost sm","<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4'/></svg> اعرض النص مرة أخرى");
    rr.onclick=()=>{ const p=el("div","passage"); S.passage.text.forEach(par=>{const w=el("div","pw"); w.appendChild(el("p","",par)); p.appendChild(w);}); rr.replaceWith(p); };
    v.appendChild(rr);
  }

  const item=buildQ(it.q,{});

  const row=el("div","row mt");

  const nx=el("button","btn", last?"إنهاء وعرض النتيجة":"التالي ←");

    const res=item.check(false);
    if(res===null){ nx.textContent="جاوب أولاً"; setTimeout(()=>nx.innerHTML=last?"إنهاء وعرض النتيجة":"التالي ←",1200); return; }
    S.res[it.sec][1]++; if(res) S.res[it.sec][0]++; else { S.wrong.push(it.q); addReview(it.q); }
    record("STEP-"+it.sec, res, it.q.uid);
    beep(res?"ok":"no");

  };
  const quit=el("button","btn ghost","إنهاء الاختبار");

function stepResult(timeout){
  if(state.stepTimer){ clearInterval(state.stepTimer); state.stepTimer=null; }
  const S=state.step, v=$("#v-step"); v.innerHTML="";
  let total=0;
  Object.keys(SECW).forEach(k=>{ const [r,n]=S.res[k]; if(n) total += (r/n)*SECW[k]; });
  total=Math.round(total);
  state.bestStep=Math.max(state.bestStep||0,total);
  const band = total>=80?["متميز","hi"] : total>=60?["جيد","mid"] : ["يحتاج تطوير","low"];
  const res=el("div","result");

/* ---- مطابقة النطق ---- */
const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are",
 "i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","we'll":"we will",
 "she'll":"she will","he'll":"he will","they'll":"they will","i'd":"i would","you'd":"you would","don't":"do not","doesn't":"does not",
 "didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not",
 "weren't":"were not","haven't":"have not","hasn't":"has not","hadn't":"had not","shouldn't":"should not","couldn't":"could not",
 "wouldn't":"would not","mustn't":"must not","that's":"that is","there's":"there is","what's":"what is","let's":"let us","'ve":"have"};
function normWord(w){ return w.toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(/[^a-z0-9']/g,""); }
function expandTokens(w){ const n=normWord(w); if(!n) return []; return (CONTR[n]||n).split(" "); }
function scoreSpeech(target, heard){
  const words=target.split(/\s+/);
  const T=[], owner=[];
  words.forEach((w,i)=>expandTokens(w).forEach(t=>{T.push(t); owner.push(i);}));
  const H=[]; String(heard).split(/\s+/).forEach(w=>expandTokens(w).forEach(t=>H.push(t)));
  const m=T.length,n=H.length, dp=[];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); }
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j] = T[i-1]===H[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Set(); let i=m,j=n;
  while(i>0&&j>0){ if(T[i-1]===H[j-1]){hit.add(i-1);i--;j--;} else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--; }
  const wordOk = words.map((w,wi)=>{ const idx=owner.map((o,k)=>o===wi?k:-1).filter(k=>k>-1); return idx.length===0 || idx.every(k=>hit.has(k)); });
  const pct = T.length? Math.round(hit.size/T.length*100) : 0;
  return {words, wordOk, pct};
}

  let k=0;

    if(k>=times){ btn.disabled=false; btn.innerHTML="<svg class='i' viewBox='0 0 24 24' fill='none' stroke='currentColor'><path d='M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3'/></svg> تكرار ×3"; return; }

    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=TTS_RATE;
    u.onend=()=>setTimeout(one, 900 + text.split(" ").length*260);

function globalSearch(qy){
  qy=qy.trim().toLowerCase(); if(qy.length<2) return [];
  const out=[];
  LESSONS.forEach(L=>{ if((L.t+" "+L.ta+" "+L.intro).toLowerCase().indexOf(qy)>-1)
    out.push({t:L.t, s:"Lesson · "+L.ta+" · "+L.lvl, go:()=>{ go("lessons"); openLesson(L.id); }}); });
  READING.forEach(R=>{ if((R.t+" "+R.ta).toLowerCase().indexOf(qy)>-1)
    out.push({t:R.t, s:"Reading · "+R.ta+" · "+R.lvl, go:()=>{ go("read"); openReading(R.id); }}); });
  LISTEN.forEach(S=>{ if((S.ta+" "+S.type+" "+S.script).toLowerCase().indexOf(qy)>-1)
    out.push({t:S.ta, s:"Listening · "+S.type, go:()=>{ go("step"); openListen(S.id); }}); });
  VOCAB.forEach(U=>{
    if(U.t.toLowerCase().indexOf(qy)>-1 || U.ta.indexOf(qy)>-1) out.push({t:U.t, s:"Vocabulary unit · "+U.ta, go:()=>{ go("vocab"); openVocab(U.id); }});
    U.w.forEach(w=>{ if(w[0].toLowerCase().indexOf(qy)>-1 || w[2].indexOf(qy)>-1)
      out.push({t:w[0], s:"Word · "+w[2]+" · "+U.ta, go:()=>{ go("vocab"); openVocab(U.id); }}); });
  });
  return out.slice(0,12);
}

      if(!list.length)s.appendChild(el("div","note","لا توجد طالبات مسجلات بعد. عندما تدخل الطالبة باسمها من جوالها ستظهر هنا تلقائيًا."));
      else{
        const table=document.createElement("table");table.className="tbl";const hr=document.createElement("tr");["الطالبة","الصف","XP","الأسئلة","الدقة","الدروس","أفضل سلسلة","STEP","النطق","آخر نشاط"].forEach(h=>hr.appendChild(el("th","",h)));table.appendChild(hr);
        list.forEach(st=>{const p=st.progress||{},q=Number(p.answered||0),right=Number(p.right||0),acc=q?Math.round(right/q*100):0,lessons=p.qdone&&typeof p.qdone==="object"?Object.values(p.qdone).filter(v=>v===true).length:0,tr=document.createElement("tr");
          [st.name||"—",st.class_name||"—",Number(p.xp||0),q,acc+"%",lessons,Number(p.best||0),Number(p.bestStep||0),p.shCount?Math.round(Number(p.shSum||0)/Number(p.shCount))+"%":"—",st.last_seen?new Date(st.last_seen).toLocaleString("ar-SA"):"—"].forEach((v,i)=>tr.appendChild(el("td",i>=2&&i<=8?"num":"",String(v))));table.appendChild(tr)});
        s.appendChild(table);s.appendChild(el("div","note","عدد الطالبات: "+list.length+" · البيانات متزامنة من الأجهزة المتصلة بالإنترنت."));
      }
      $("#sheet").classList.add("open");
    }catch(e){sessionStorage.removeItem("teacher_api_token");alert("تعذر الاتصال بخدمة البيانات. تأكدي أن teacherhuda-api تعمل.")}
  }
  try{openTeacher=showTeacherDashboard}catch(e){}
  window.showTeacherDashboard=showTeacherDashboard;
  setTimeout(syncLoop,1200);setInterval(syncLoop,5000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncLoop()});
  document.addEventListener("click",function(ev){const b=ev.target.closest("button");if(b&&b.dataset&&b.dataset.act==="teacher"){ev.preventDefault();ev.stopImmediatePropagation();showTeacherDashboard()}},true);
})();
</script>
</body>
